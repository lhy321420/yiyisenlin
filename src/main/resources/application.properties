spring.application.name=front-study
server.port=8080

# Railway MySQL??????????
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis ????????
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.demo.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Session ????????
server.servlet.session.timeout=1800s
server.servlet.session.cookie.name=FOREST_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true

# ??????????
logging.level.com.example.demo=DEBUG

# ========== ???????????????? ==========
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
# ????????????????? upload ????????
spring.servlet.multipart.location=./upload-temp

