<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>壹一森林</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pinyin-pro@3.19.6/dist/index.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .photo-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .delete-photo-btn, .delete-comment-btn {
            background: none;
            border: none;
            color: #f8446e;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .delete-photo-btn:hover, .delete-comment-btn:hover {
            transform: scale(1.1);
            color: #d63c60;
        }
        body {
            background-color: #fff9f5;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .big {
            display: flex;
            align-items: center;
            background: rgb(255, 255, 158);
            padding: 8px 15px;
            justify-content: space-between;
            margin: 10px 100px;
            border-radius: 15px;
            height: 46px;
        }
        .first { display: flex; align-items: center; gap: 6px; }
        .heart { font-size: 16px; cursor: pointer; transition: 0.2s; }
        .heart:hover { transform: scale(1.1); }
        .name p { font-size: 12px; line-height: 1.2; color: rgb(146, 86, 30); }
        .bell {
            font-size: 18px;
            color: rgb(199, 199, 158);
            cursor: pointer;
            margin-left: 6px;
            transition: 0.3s;
            position: relative;
        }
        .bell:hover { color: #f8446e; }
        .red-dot {
            position: absolute;
            top: -5px;
            right: -8px;
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            display: none;
        }
        .nav {
            display: flex;
            background: rgb(252, 252, 192);
            color: rgb(146, 86, 30);
            padding: 2px 10px;
            border-radius: 15px;
            height: 28px;
            gap: 12px;
        }
        .nav-item {
            padding: 2px 10px;
            border: 2px solid transparent;
            border-radius: 15px;
            transition: all 0.3s ease;
            font-size: 14px;
            cursor: pointer;
        }
        .nav-item.active {
            background-color: rgb(255, 239, 200);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .nav-item:hover {
            background-color: rgb(255, 239, 200);
            transform: translateY(-1px);
        }
        .user-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffdde0;
            padding: 4px 12px;
            border-radius: 20px;
            color: #c74c70;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .switch-btn {
            width: 28px;
            height: 14px;
            background: #fff;
            border-radius: 10px;
            position: relative;
        }
        .switch-btn::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        .album-top {
            max-width: 1100px;
            margin: 30px auto 20px;
            padding: 0 20px;
            text-align: center;
        }
        .album-title {
            font-size: 32px;
            color: #e67a8a;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .search-input {
            padding: 8px 14px;
            border: 1px solid #f0d8c0;
            border-radius: 20px;
            outline: none;
            width: 200px;
            font-size: 14px;
        }
        .search-btn {
            padding: 8px 20px;
            background: #ffccd5;
            color: #c74c70;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-btn:hover { background: #ffb3c1; }
        .album-container {
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }
        .photo-card {
            background: #fff;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 12px rgba(245,190,150,0.15);
            transition: 0.3s;
            cursor: pointer;
        }
        .photo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(245,190,150,0.2);
        }
        .photo-img {
            width: 100%;
            height: 200px;
            background: #ffe8ee;
            border-radius: 12px;
            margin-bottom: 12px;
            background-size: cover;
            background-position: center;
        }
        .photo-info {
            font-size: 13px;
            color: #9c5a22;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar-small {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
        }
        .photo-description {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .photo-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #c74c70;
            border-top: 1px solid #fae5d5;
            padding-top: 8px;
            margin-top: 8px;
        }
        .upload-area {
            max-width: 1100px;
            margin: 0 auto 40px;
            padding: 0 20px;
            text-align: center;
        }
        .upload-btn {
            padding: 10px 26px;
            background: #f9ce85;
            color: #9c5a22;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-btn:hover { background: #f8c068; }

        /* 上传弹窗样式 */
        .upload-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .upload-modal .modal-content {
            background: #fff9f5;
            width: 500px;
            max-width: 90%;
            border-radius: 24px;
            padding: 25px;
            position: relative;
        }
        .upload-modal textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #f7d3c2;
            border-radius: 16px;
            margin: 15px 0;
            resize: vertical;
        }
        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            margin: 10px 0;
        }

        /* 照片详情弹窗 */
        .photo-detail-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            overflow-y: auto;
        }
        .detail-content {
            background: #fff9f5;
            width: 600px;
            max-width: 90%;
            border-radius: 24px;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .detail-img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 16px;
            margin-bottom: 15px;
        }
        .comment-item {
            margin-top: 15px;
            padding: 12px;
            background: #fff0e8;
            border-radius: 16px;
            display: flex;
            gap: 10px;
        }
        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .comment-content {
            flex: 1;
        }
        .comment-name {
            font-weight: bold;
            color: #c74c70;
            font-size: 13px;
        }
        .comment-time {
            font-size: 11px;
            color: #999;
            margin-left: 8px;
        }
        .comment-text {
            margin-top: 4px;
            font-size: 13px;
            color: #666;
        }

        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-content {
            background: #fff;
            width: 280px;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .modal-btn {
            padding: 6px 18px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
        }
        .cancel { background: #f1f1f1; }
        .logout { background: #f8446e; color: #fff; }
    </style>
</head>
<body>
<div class="big">
    <div class="first">
        <div class="heart" onclick="toUserInfo()">❤️</div>
        <div class="name">
            <p>SPACE</p>
            <p>壹一森林</p>
        </div>
        <div class="bell" onclick="goToMessage()" style="position: relative;">
            <i class="fa-solid fa-bell"></i>
            <span class="red-dot" id="redDot" style="display: none; position: absolute; top: -5px; right: -8px; width: 10px; height: 10px; background: #f8446e; border-radius: 50%;"></span>
        </div>
    </div>
    <div class="nav">
        <div class="nav-item" onclick="go('index')"><strong>首页</strong></div>
        <div class="nav-item" onclick="go('role')"><strong>朋友</strong></div>
        <div class="nav-item" onclick="go('record')"><strong>记录</strong></div>
        <div class="nav-item active" onclick="go('album')"><strong>相册</strong></div>
        <div class="nav-item" onclick="go('map')"><strong>地图</strong></div>
    </div>
    <div class="user-right" onclick="showLogoutModal()">
        <span id="userInitial">加载中...</span>
        <div class="switch-btn" id="switch"></div>
    </div>
</div>

<div class="album-top">
    <h1 class="album-title">伙伴相册</h1>
    <div class="search-box">
        <input class="search-input" id="searchName" placeholder="搜索人名">
        <input class="search-input" id="searchTime" placeholder="搜索上传时间 (YYYY-MM-DD)">
        <button class="search-btn" onclick="searchPhoto()">开始查找</button>
        <button class="search-btn" onclick="resetSearch()" style="background:#f9ce85;">重置</button>
    </div>
</div>

<div class="album-container" id="photoList">
    <div style="grid-column:1/-1; text-align:center; padding:40px; color:#9c5a22;">加载中...</div>
</div>

<div class="upload-area">
    <button class="upload-btn" onclick="openUploadModal()">
        <i class="fa-solid fa-upload"></i> 上传新照片
    </button>
</div>

<!-- 上传弹窗 -->
<div id="uploadModal" class="upload-modal">
    <div class="modal-content">
        <span style="position:absolute; top:15px; right:20px; font-size:24px; cursor:pointer; color:#c74c70;" onclick="closeUploadModal()">&times;</span>
        <h3 style="color:#c74c70; margin-bottom:15px;">✨ 上传照片 ✨</h3>
        <input type="file" id="photoFile" accept="image/*" onchange="previewPhoto()">
        <div id="previewContainer" style="text-align:center;"></div>
        <textarea id="photoDesc" rows="3" placeholder="写下此刻心情..."></textarea>
        <button onclick="uploadPhoto()" style="width:100%; padding:10px; background:#ffccd5; border:none; border-radius:30px; color:#c74c70; font-weight:bold; cursor:pointer;">发布照片</button>
    </div>
</div>

<!-- 照片详情弹窗 -->
<div id="detailModal" class="photo-detail-modal">
    <div class="detail-content" id="detailContent"></div>
</div>

<div class="modal" id="logoutModal">
    <div class="modal-content">
        <h3>确定退出登录？</h3>
        <div class="modal-btns">
            <button class="modal-btn cancel" onclick="closeModal()">取消</button>
            <button class="modal-btn logout" onclick="logout()">退出</button>
        </div>
    </div>
</div>

<script>
    // 删除评论
    window.deleteComment = async function(commentId, photoId) {
        if (!confirm('确定要删除这条评论吗？')) return;
        try {
            const res = await fetch('/user/photo/deleteComment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ commentId }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                alert('删除成功');
                showPhotoDetail(photoId); // 刷新详情页
            } else {
                alert('删除失败：' + (result.msg || '未知错误'));
            }
        } catch(e) {
            console.error(e);
            alert('网络错误');
        }
    };

    // 删除照片
    window.deletePhoto = async function(photoId) {
        if (!confirm('确定要删除这张照片吗？删除后无法恢复！')) return;
        try {
            const res = await fetch('/user/photo/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ photoId }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                alert('删除成功');
                closeDetailModal();
                loadPhotos(); // 刷新照片列表
            } else {
                alert('删除失败：' + (result.msg || '未知错误'));
            }
        } catch(e) {
            console.error(e);
            alert('网络错误');
        }
    };
    // 辅助函数
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    function showMessage(msg) { alert(msg); }

    function getNameInitials(username) {
        if (!username) return '游客';
        const { pinyin } = window.pinyinPro || window.pinyin;
        if (!pinyin) return username.charAt(0).toUpperCase();
        const chars = username.split('');
        const initials = chars.map(char => {
            if (/[a-zA-Z]/.test(char)) return char.toUpperCase();
            if (/[\u4e00-\u9fa5]/.test(char)) {
                const py = pinyin(char, { pattern: 'first', toneType: 'none' });
                return py ? py.toUpperCase() : char;
            }
            return char.toUpperCase();
        });
        return initials.join(' ');
    }

    let currentUserId = null;
    let selectedFile = null;

    // 加载照片列表
    // 加载照片列表
    async function loadPhotos() {
        try {
            const res = await fetch("/user/photo/list", { credentials: "include" });
            const result = await res.json();
            const container = document.getElementById('photoList');
            if (result.code === 200 && result.data) {
                if (result.data.length === 0) {
                    container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#9c5a22;">暂无照片，快来上传第一张吧~</div>';
                    return;
                }
                let html = '';
                result.data.forEach(photo => {
                    let avatarStyle = photo.avatar && photo.avatar.startsWith('data:image')
                        ? `style="background-image: url('${photo.avatar}'); background-size: cover;"`
                        : 'style="background: #ffe8e8;"';
                    const isOwner = currentUserId === photo.userId;
                    const deleteBtn = isOwner ? `<button class="delete-photo-btn" data-id="${photo.id}" onclick="event.stopPropagation(); deletePhoto(${photo.id})"><i class="fa-regular fa-trash-can"></i></button>` : '';

                    // 关键：把 onclick 放到最外层 div，整卡可点击
                    html += `
                <div class="photo-card" data-id="${photo.id}" onclick="showPhotoDetail(${photo.id})">
                    <div class="photo-img" style="background-image: url('${photo.imageUrl}'); background-size: cover;"></div>
                    <div class="photo-info">
                        <div class="user-info">
                            <div class="user-avatar-small" ${avatarStyle}></div>
                            <span>${escapeHtml(photo.username)}</span>
                        </div>
                        <div class="photo-actions">
                            <span><i class="fa-regular fa-calendar"></i> ${photo.uploadTime}</span>
                            ${deleteBtn}
                        </div>
                    </div>
                    <div class="photo-description">${escapeHtml(photo.description || '')}</div>
                    <div class="photo-stats">
                        <span><i class="fa-regular fa-heart"></i> ${photo.likeCount || 0}</span>
                        <span><i class="fa-regular fa-comment"></i> ${photo.commentCount || 0}</span>
                    </div>
                </div>
                `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#9c5a22;">加载失败</div>';
            }
        } catch(e) {
            console.error(e);
            document.getElementById('photoList').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#9c5a22;">网络错误</div>';
        }
    }

    // 显示照片详情
    window.showPhotoDetail = async function(photoId) {
        try {
            const res = await fetch(`/user/photo/detail?id=${photoId}`, { credentials: "include" });
            const result = await res.json();
            if (result.code === 200) {
                const photo = result.data;
                // 判断是否是当前用户的照片，显示删除按钮
                const isPhotoOwner = currentUserId === photo.userId;
                // 加载评论
                const commentsRes = await fetch(`/user/photo/comments?photoId=${photoId}`, { credentials: "include" });
                const commentsResult = await commentsRes.json();
                let commentsHtml = '';
                if (commentsResult.code === 200 && commentsResult.data) {
                    commentsResult.data.forEach(c => {
                        let avatarStyle = c.avatar && c.avatar.startsWith('data:image')
                            ? `style="background-image: url('${c.avatar}'); background-size: cover;"`
                            : 'style="background: #ffe8e8;"';
                        // 判断是否是当前用户的评论，显示删除按钮
                        const isCommentOwner = currentUserId === c.userId;
                        const deleteCommentBtn = isCommentOwner ? `<button class="delete-comment-btn" onclick="event.stopPropagation(); deleteComment(${c.id}, ${photoId})"><i class="fa-regular fa-trash-can"></i></button>` : '';
                        commentsHtml += `
                        <div class="comment-item">
                            <div class="comment-avatar" ${avatarStyle}></div>
                            <div class="comment-content">
                                <div>
                                    <span class="comment-name">${escapeHtml(c.username)}</span>
                                    <span class="comment-time">${c.createTime}</span>
                                    ${deleteCommentBtn}
                                </div>
                                <div class="comment-text">${escapeHtml(c.content)}</div>
                            </div>
                        </div>
                    `;
                    });
                }
                const isOwner = currentUserId === photo.userId;
                const deletePhotoBtn = isOwner ? `<button onclick="deletePhoto(${photo.id})" style="background:#f8446e; color:#fff; border:none; border-radius:30px; padding:5px 15px; margin-bottom:10px; cursor:pointer;"><i class="fa-regular fa-trash-can"></i> 删除照片</button>` : '';
                const detailHtml = `
                <div style="position:relative;">
                    <span class="modal-close" style="position:absolute; top:0; right:0; font-size:24px; cursor:pointer;" onclick="closeDetailModal()">&times;</span>
                    <img src="${photo.imageUrl}" class="detail-img">
                    <div style="color:#999; margin:5px 0;">${escapeHtml(photo.username)} · ${photo.uploadTime}</div>
                    <div>${escapeHtml(photo.description || '')}</div>
                    ${deletePhotoBtn}
                    <div style="margin:10px 0;">
                        <button id="likePhotoBtn" class="like-btn" data-liked="${photo.likedByCurrentUser}" data-id="${photo.id}" style="background:none; border:none; color:#c74c70; cursor:pointer;">❤️ ${photo.likeCount}</button>
                    </div>
                    <h3>留言板</h3>
                    <div id="commentsArea">${commentsHtml}</div>
                    <div style="margin-top:15px;">
                        <textarea id="newComment" rows="2" placeholder="写一条留言..." style="width:100%; border:1px solid #f7d3c2; border-radius:12px; padding:8px;"></textarea>
                        <button onclick="submitPhotoComment(${photo.id})" style="background:#ffccd5; border:none; border-radius:30px; padding:5px 15px; margin-top:8px; color:#c74c70;">发布留言</button>
                    </div>
                </div>
            `;
                document.getElementById('detailContent').innerHTML = detailHtml;
                document.getElementById('detailModal').style.display = 'flex';
                document.getElementById('likePhotoBtn')?.addEventListener('click', () => togglePhotoLike(photo.id));
            } else {
                alert('无法查看照片详情');
            }
        } catch(e) { console.error(e); alert('加载失败'); }
    }

    function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

    // 点赞照片
    async function togglePhotoLike(photoId) {
        const btn = document.getElementById('likePhotoBtn');
        if (!btn) return;
        try {
            const res = await fetch('/user/photo/toggleLike', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ photoId }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                const liked = result.liked;
                let count = parseInt(btn.innerText.split('❤️')[1].trim());
                btn.innerText = `❤️ ${liked ? count + 1 : count - 1}`;
                btn.setAttribute('data-liked', liked);
            }
        } catch(e) { console.error(e); }
    }

    // 添加照片评论
    async function submitPhotoComment(photoId) {
        const contentArea = document.getElementById('newComment');
        let content = contentArea.value.trim();
        if (!content) { alert('请输入内容'); return; }
        try {
            const res = await fetch('/user/photo/addComment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ photoId, content }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                alert('评论成功');
                contentArea.value = '';
                showPhotoDetail(photoId);
            } else {
                alert('评论失败');
            }
        } catch(e) { console.error(e); alert('网络错误'); }
    }

    // 搜索功能
    async function searchPhoto() {
        let nameKey = document.getElementById('searchName').value.trim();
        let timeKey = document.getElementById('searchTime').value.trim();
        if (!nameKey && !timeKey) {
            loadPhotos();
            return;
        }
        try {
            let url = '';
            if (nameKey) {
                url = `/user/photo/searchByName?keyword=${encodeURIComponent(nameKey)}`;
            } else {
                url = `/user/photo/searchByTime?date=${encodeURIComponent(timeKey)}`;
            }
            const res = await fetch(url, { credentials: "include" });
            const result = await res.json();
            const container = document.getElementById('photoList');
            if (result.code === 200 && result.data) {
                if (result.data.length === 0) {
                    container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#9c5a22;">未找到相关照片</div>';
                    return;
                }
                let html = '';
                result.data.forEach(photo => {
                    let avatarStyle = photo.avatar && photo.avatar.startsWith('data:image')
                        ? `style="background-image: url('${photo.avatar}'); background-size: cover;"`
                        : 'style="background: #ffe8e8;"';
                    html += `
                        <div class="photo-card" onclick="showPhotoDetail(${photo.id})">
                            <div class="photo-img" style="background-image: url('${photo.imageUrl}'); background-size: cover;"></div>
                            <div class="photo-info">
                                <div class="user-info">
                                    <div class="user-avatar-small" ${avatarStyle}></div>
                                    <span>${escapeHtml(photo.username)}</span>
                                </div>
                                <span>${photo.uploadTime}</span>
                            </div>
                            <div class="photo-description">${escapeHtml(photo.description || '')}</div>
                            <div class="photo-stats">
                                <span>❤️ ${photo.likeCount || 0}</span>
                                <span>💬 ${photo.commentCount || 0}</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        } catch(e) { console.error(e); }
    }

    function resetSearch() {
        document.getElementById('searchName').value = '';
        document.getElementById('searchTime').value = '';
        loadPhotos();
    }

    // 上传相关
    function openUploadModal() {
        document.getElementById('uploadModal').style.display = 'flex';
        document.getElementById('photoFile').value = '';
        document.getElementById('photoDesc').value = '';
        document.getElementById('previewContainer').innerHTML = '';
        selectedFile = null;
    }
    function closeUploadModal() { document.getElementById('uploadModal').style.display = 'none'; }

    function previewPhoto() {
        const file = document.getElementById('photoFile').files[0];
        if (!file) return;
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewContainer').innerHTML = `<img src="${e.target.result}" class="preview-img">`;
        };
        reader.readAsDataURL(file);
    }

    // 压缩图片函数
    function compressImage(file, maxWidth = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = (height * maxWidth) / width;
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                    resolve(compressedBase64);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function uploadPhoto() {
        if (!selectedFile) { alert('请选择照片'); return; }
        const description = document.getElementById('photoDesc').value.trim();

        // 压缩图片
        const compressedBase64 = await compressImage(selectedFile, 800, 0.7);

        try {
            const res = await fetch('/user/photo/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageUrl: compressedBase64, description }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                alert('上传成功！');
                closeUploadModal();
                loadPhotos();
            } else {
                alert('上传失败：' + (result.msg || '未知错误'));
            }
        } catch(e) { console.error(e); alert('网络错误'); }
    }

    // 更新红点状态
    async function updateRedDot() {
        try {
            const res = await fetch("/user/unreadNotificationCount", { method: "GET", credentials: "include" });
            const result = await res.json();
            const redDot = document.getElementById('redDot');
            if (result.code === 200 && result.data > 0) redDot.style.display = 'block';
            else redDot.style.display = 'none';
        } catch (err) { console.error(err); }
    }

    // 页面初始化
    window.onload = async function() {
        if (!localStorage.getItem('isLogin')) {
            location.href = 'login.html';
            return;
        }
        try {
            const res = await fetch("/user/info", { method: "GET", credentials: "include" });
            const result = await res.json();
            if (result.code === 200 && result.data && result.data.username) {
                const username = result.data.username;
                const initials = getNameInitials(username);
                document.getElementById('userInitial').innerText = initials;
                localStorage.setItem('username', username);
                currentUserId = result.data.id;
            } else {
                localStorage.removeItem('isLogin');
                location.href = 'login.html';
                return;
            }
        } catch (err) {
            console.error(err);
            localStorage.removeItem('isLogin');
            location.href = 'login.html';
            return;
        }
        await loadPhotos();
        await updateRedDot();
    };

    function toUserInfo() { location.href = "user-info.html"; }
    function goToMessage() { window.location.href = "message.html"; }
    function go(page) {
        const links = { index:"index.html", role:"member.html", record:"diary.html", album:"about.html", map:"travel.html" };
        window.location.href = links[page];
    }
    function showLogoutModal() {
        document.getElementById('logoutModal').style.display = 'flex';
        document.getElementById('switch').classList.add('active');
    }
    function closeModal() {
        document.getElementById('logoutModal').style.display = 'none';
        document.getElementById('switch').classList.remove('active');
    }
    function logout() {
        localStorage.removeItem('isLogin');
        localStorage.removeItem('username');
        fetch("/user/logout", { method: "POST", credentials: "include" }).catch(e=>console.log);
        location.href = 'login.html';
    }
</script>
