<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>壹一森林</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pinyin-pro@3.19.6/dist/index.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #fff9f5;
            font-family: system-ui, "Microsoft YaHei", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* ========== 导航栏 手机完美适配 ========== */
        .big {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgb(255, 255, 158);
            margin: 12px auto;
            padding: 10px 14px;
            width: calc(100% - 20px);
            max-width: 1000px;
            border-radius: 28px;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .first {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .heart {
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255, 220, 180, 0.4);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .heart:active {
            transform: scale(0.94);
            background: #ffe0b5;
        }

        .name p {
            font-size: 11px;
            line-height: 1.25;
            color: rgb(146, 86, 30);
            font-weight: 500;
        }

        .name p:first-child {
            font-size: 10px;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .bell {
            font-size: 20px;
            color: rgb(199, 199, 158);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            background: rgba(255, 240, 200, 0.5);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .bell:active {
            transform: scale(0.94);
            color: #f8446e;
        }

        .red-dot {
            position: absolute;
            top: 2px;
            right: 4px;
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            display: none;
            border: 1.5px solid #ffff9e;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: rgb(252, 252, 192);
            padding: 6px 12px;
            border-radius: 40px;
            flex: 1 1 auto;
            min-width: 160px;
        }

        .nav-item {
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: rgb(146, 86, 30);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            background: transparent;
            text-align: center;
        }

        .nav-item.active {
            background-color: rgb(255, 239, 200);
            color: #bc6f2c;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .nav-item:active {
            background-color: rgb(255, 230, 180);
            transform: scale(0.96);
        }

        .user-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffdde0;
            padding: 6px 12px;
            border-radius: 40px;
            color: #c74c70;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .user-right:active {
            background: #ffcbd1;
            transform: scale(0.97);
        }

        .switch-btn {
            width: 28px;
            height: 14px;
            background: #fff;
            border-radius: 10px;
            position: relative;
        }

        .switch-btn::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }

        @media (max-width: 620px) {
            .big { flex-direction: column; align-items: stretch; padding: 12px; gap: 10px; }
            .first { justify-content: space-between; width: 100%; }
            .nav { width: 100%; justify-content: center; }
            .user-right { align-self: flex-end; width: fit-content; }
            .nav-item { padding: 6px 10px; font-size: 13px; }
        }
        @media (max-width: 480px) {
            .nav-item { padding: 5px 8px; font-size: 12px; }
            .first .heart, .first .bell { width: 32px; height: 32px; }
        }

        /* ========== 弹窗通用 ========== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1200;
            padding: 16px;
        }
        .modal-content {
            background: #fffef8;
            width: 90%;
            max-width: 280px;
            padding: 22px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
        }
        .modal-title { font-size: 16px; margin-bottom: 15px; color: #9c5a22; font-weight: 600; }
        .modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .modal-btn { padding: 6px 18px; border-radius: 40px; border: none; cursor: pointer; font-size: 13px; min-width: 80px; font-weight: 500; }
        .cancel { background: #f1f1f1; color: #6b4c2c; }
        .logout { background: #f8446e; color: #fff; }
        .img-modal { background: rgba(0, 0, 0, 0.85); }
        .img-modal img { max-width: 90%; max-height: 85%; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); cursor: pointer; }

        /* ========== 记录页面布局 ========== */
        .diary-layout {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px 40px;
            display: flex;
            gap: 20px;
            flex-direction: column;
        }
        @media (min-width: 769px) {
            .diary-layout { flex-direction: row; align-items: flex-start; }
            .diary-sidebar { width: 220px; flex-shrink: 0; flex-direction: column; overflow-x: visible; }
            .side-tab { white-space: normal; margin-bottom: 8px; }
        }
        .diary-sidebar {
            background: #fffef5;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 6px 14px rgba(245, 190, 150, 0.1);
            border: 1px solid #ffe0cf;
            display: flex;
            overflow-x: auto;
            gap: 12px;
            width: 100%;
            scrollbar-width: thin;
        }
        .side-tab {
            white-space: nowrap;
            flex-shrink: 0;
            padding: 10px 18px;
            border-radius: 40px;
            text-align: center;
            font-weight: 700;
            color: #9c5a22;
            cursor: pointer;
            font-size: 14px;
            background: rgba(255, 230, 210, 0.3);
            transition: 0.2s;
        }
        .side-tab.active { background: #ffccd5; color: #c74c70; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .side-tab:active { transform: scale(0.96); }
        .diary-content { flex: 1; width: 100%; }

        /* 日记卡片 */
        .friend-diary-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 22px rgba(245, 190, 150, 0.12);
            position: relative;
            width: 100%;
        }
        .diary-delete-btn {
            position: absolute;
            right: 16px;
            top: 16px;
            background: #ffeaea;
            color: #ff6b6b;
            border: none;
            border-radius: 30px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            z-index: 10;
        }
        .diary-delete-btn:active { background: #ffc2c2; }
        .diary-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .friend-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffe8e8;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .friend-info h4 { color: #9c5a22; cursor: pointer; font-size: 16px; font-weight: 800; }
        .friend-info p { font-size: 11px; color: #c28a60; }
        .diary-title { font-size: 18px; font-weight: 800; color: #c74c70; margin-bottom: 10px; line-height: 1.3; }
        .diary-content-text { color: #4d3a2a; line-height: 1.6; margin-bottom: 14px; word-break: break-word; font-size: 14px; }
        .diary-photos { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .diary-photo {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            background-size: cover;
            background-position: center;
            background-color: #f7e4d8;
            cursor: pointer;
            transition: 0.1s;
        }
        .diary-photo:active { transform: scale(0.96); }
        .diary-actions {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #c74c70;
            margin-bottom: 18px;
            border-top: 1px solid #f7e0d2;
            padding-top: 14px;
        }
        .diary-actions button {
            background: none;
            border: none;
            color: #c74c70;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        .diary-actions button:active { transform: scale(0.95); }
        .comment-section { border-top: 1px solid #f7e0d2; padding-top: 16px; }
        .comment-item {
            background: #fff4ee;
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .comment-content { flex: 1; min-width: 0; }
        .comment-author { font-weight: 700; color: #9c5a22; font-size: 13px; }
        .comment-time { font-size: 10px; color: #b7855b; margin-bottom: 5px; }
        .comment-text { color: #5c412c; font-size: 13px; word-break: break-word; }
        .comment-delete { color: #ff8a7a; border: none; background: none; cursor: pointer; font-size: 12px; padding: 4px 8px; }
        .comment-input {
            width: 100%;
            border: 1px solid #f7d3c2;
            border-radius: 20px;
            padding: 12px;
            margin-top: 12px;
            resize: vertical;
            font-size: 14px;
            background: #fff;
        }
        .comment-submit {
            background: #ffccd5;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            color: #c74c70;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
        }
        .comment-submit:active { background: #ffb8c4; }
        .no-data { text-align: center; padding: 50px 20px; color: #b7865c; background: #fff6ef; border-radius: 40px; font-size: 15px; }
        .private-tip { text-align: center; padding: 40px; color: #c74c70; background: #fff0e8; border-radius: 28px; font-size: 14px; }
    </style>
</head>
<body>

<div class="big">
    <div class="first">
        <div class="heart" onclick="toUserInfo()">❤️</div>
        <div class="name"><p>SPACE</p><p>壹一森林</p></div>
        <div class="bell" onclick="goToMessage()">
            <i class="fa-solid fa-bell"></i>
            <span class="red-dot" id="redDotDiary"></span>
        </div>
    </div>
    <div class="nav">
        <div class="nav-item" onclick="go('index')"><strong>首页</strong></div>
        <div class="nav-item" onclick="go('role')"><strong>朋友</strong></div>
        <div class="nav-item active" onclick="go('record')"><strong>记录</strong></div>
        <div class="nav-item" onclick="go('album')"><strong>相册</strong></div>
        <div class="nav-item" onclick="go('map')"><strong>地图</strong></div>
    </div>
    <div class="user-right" onclick="showLogoutModal()">
        <span id="userInitial">加载中...</span>
        <div class="switch-btn" id="switch"></div>
    </div>
</div>

<div class="modal" id="logoutModal">
    <div class="modal-content">
        <div class="modal-title">确定要退出登录吗？</div>
        <div class="modal-btns">
            <button class="modal-btn cancel" onclick="closeModal()">取消</button>
            <button class="modal-btn logout" onclick="logout()">退出</button>
        </div>
    </div>
</div>

<div class="modal img-modal" id="imgModal" onclick="closeImg()">
    <img id="enlargedImg" src="" alt="预览">
</div>

<div class="diary-layout">
    <div class="diary-sidebar">
        <div class="side-tab active" data-type="public">🌐 森林记录</div>
        <div class="side-tab" data-type="my">📖 私人小记</div>
        <div class="side-tab" data-type="favorite">⭐ 收藏果果</div>
        <div class="side-tab" data-type="write">✏️ 写下今天</div>
    </div>
    <div class="diary-content" id="diaryList"></div>
</div>

<script>
    // ==================== 工具函数 ====================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    function getNameInitials(username) {
        if (!username) return '游客';
        const { pinyin } = window.pinyinPro || window.pinyin;
        if (!pinyin) return username.charAt(0).toUpperCase();
        return username.split('').map(ch => {
            if (/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
            if (/[\u4e00-\u9fa5]/.test(ch)) {
                const py = pinyin(ch, { pattern: 'first', toneType: 'none' });
                return py ? py.toUpperCase() : ch;
            }
            return ch.toUpperCase();
        }).join(' ');
    }

    function closeModal() {
        document.getElementById('logoutModal').style.display = 'none';
        document.getElementById('switch').classList.remove('active');
    }
    function closeImg() { document.getElementById('imgModal').style.display = 'none'; }
    function openImg(src) {
        const modal = document.getElementById('imgModal');
        const img = document.getElementById('enlargedImg');
        img.src = src;
        modal.style.display = 'flex';
    }

    let currentUserId = null;
    let currentTab = 'public';
    let friendsList = []; // 存储好友ID列表

    window.onload = async function() {
        if (!localStorage.getItem('isLogin')) {
            location.href = 'login.html';
            return;
        }
        try {
            const res = await fetch("/user/info", { credentials: 'include' });
            const result = await res.json();
            if (result.code === 200 && result.data && result.data.id) {
                currentUserId = result.data.id;
                const username = result.data.username;
                document.getElementById('userInitial').innerText = getNameInitials(username);
                localStorage.setItem('username', username);
                // 加载好友列表
                await loadFriendsList();
            } else {
                localStorage.removeItem('isLogin');
                location.href = 'login.html';
                return;
            }
        } catch (e) {
            console.error(e);
            localStorage.removeItem('isLogin');
            location.href = 'login.html';
            return;
        }
        await loadDiaries('public');
        await updateRedDot();
    };

    // 加载好友列表（用于权限判断）
    async function loadFriendsList() {
        try {
            const res = await fetch("/user/friends", { method: "GET", credentials: "include" });
            const result = await res.json();
            if (result.code === 200 && result.data) {
                friendsList = result.data.map(f => f.id);
            }
        } catch(e) { console.error(e); }
    }

    // 判断是否好友（或自己）
    function isFriendOrSelf(userId) {
        if (userId === currentUserId) return true;
        return friendsList.includes(userId);
    }

    async function loadDiaries(type) {
        currentTab = type;
        const list = document.getElementById('diaryList');
        list.innerHTML = '🍃 加载森林时光...';
        let url = '';
        if (type === 'public') url = '/user/diary/public';
        else if (type === 'my') url = '/user/diary/my';
        else if (type === 'favorite') url = '/user/diary/favorites';
        if (!url) return;

        try {
            const res = await fetch(url, { credentials: 'include' });
            const result = await res.json();
            if (result.code !== 200 || !result.data || result.data.length === 0) {
                list.innerHTML = '<div class="no-data">📭 暂无日记，去写下第一份回忆吧～</div>';
                return;
            }

            let html = '';
            for (const d of result.data) {
                // 权限过滤：公开列表只显示好友或自己的日记
                if (type === 'public' && !isFriendOrSelf(d.userId)) {
                    continue; // 非好友的日记不展示
                }

                // 照片处理
                let photosHtml = '';
                if (d.photos) {
                    try {
                        let arr = [];
                        if (typeof d.photos === 'string') {
                            arr = JSON.parse(d.photos);
                        } else if (Array.isArray(d.photos)) {
                            arr = d.photos;
                        }
                        if (Array.isArray(arr)) {
                            arr.forEach(p => {
                                if (p && (p.startsWith('data:image') || p.startsWith('http'))) {
                                    photosHtml += `<div class="diary-photo" style="background-image:url('${escapeHtml(p)}')" onclick="openImg('${escapeHtml(p)}')"></div>`;
                                }
                            });
                        }
                    } catch (e) { console.error('解析照片失败', e); }
                }

                let avatarStyle = (d.avatar && d.avatar.startsWith('data:image'))
                    ? `background-image:url('${d.avatar}')`
                    : 'background:#ffe0cf';
                let likeCount = d.likeCount || 0;
                let favCount = d.favoriteCount || 0;
                let commentCount = d.commentCount || 0;

                // 获取评论列表
                let commentsHtml = '';
                try {
                    const commRes = await fetch(`/user/diary/comments?diaryId=${d.id}`, { credentials: 'include' });
                    const commResult = await commRes.json();
                    if (commResult.code === 200 && commResult.data) {
                        commResult.data.filter(c => !c.parentId).forEach(c => {
                            const showDelete = (c.userId === currentUserId || d.userId === currentUserId);
                            commentsHtml += `
                            <div class="comment-item" id="comment-${c.id}">
                                <div class="comment-content">
                                    <div class="comment-author">${escapeHtml(c.username)}</div>
                                    <div class="comment-time">${escapeHtml(c.createTime || '刚刚')}</div>
                                    <div class="comment-text">${escapeHtml(c.content)}</div>
                                </div>
                                ${showDelete ? `<button class="comment-delete" onclick="deleteComment(${c.id}, ${d.id})">删除</button>` : ''}
                            </div>`;
                        });
                    }
                } catch (e) { }

                const deleteBtn = (d.userId === currentUserId)
                    ? `<button class="diary-delete-btn" onclick="deleteDiary(${d.id})">删除日记</button>`
                    : '';

                html += `
                <div class="friend-diary-card" id="diary-${d.id}">
                    ${deleteBtn}
                    <div class="diary-header">
                        <div class="friend-avatar" style="${avatarStyle}" onclick="visitUser(${d.userId})"></div>
                        <div class="friend-info">
                            <h4 onclick="visitUser(${d.userId})">${escapeHtml(d.username)}</h4>
                            <p>${escapeHtml(d.createTime || '')}</p>
                        </div>
                    </div>
                    <div class="diary-title">${escapeHtml(d.title)}</div>
                    <div class="diary-content-text">${escapeHtml(d.content)}</div>
                    <div class="diary-photos">${photosHtml}</div>
                    <div class="diary-actions">
                        <button onclick="toggleLike(${d.id}, this)">❤️ <span>${likeCount}</span></button>
                        <button onclick="toggleFav(${d.id}, this)">⭐ <span>${favCount}</span></button>
                        <span>💬 ${commentCount}</span>
                    </div>
                    <div class="comment-section">
                        <h4 style="color:#9c5a22; margin-bottom: 10px; font-size: 14px;">🌿 留言板</h4>
                        ${commentsHtml}
                        <textarea class="comment-input" id="commentInput-${d.id}" placeholder="写下你的留言..." rows="2"></textarea>
                        <button class="comment-submit" onclick="submitComment(${d.id})">发布留言</button>
                    </div>
                </div>`;
            }

            if (html === '') {
                list.innerHTML = '<div class="no-data">🌿 暂无好友公开日记，去添加森林伙伴吧～</div>';
            } else {
                list.innerHTML = html;
            }
        } catch (e) {
            console.error(e);
            list.innerHTML = '<div class="no-data">🌧 加载失败，请稍后重试</div>';
        }
    }

    async function deleteDiary(diaryId) {
        if (!confirm('确定要永远删除这篇日记吗？')) return;
        try {
            const res = await fetch('/user/diary/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ diaryId }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                alert('日记已从森林中消失');
                await loadDiaries(currentTab);
            } else {
                alert('删除失败：' + (result.msg || '未知错误'));
            }
        } catch (e) { alert('网络错误'); }
    }

    async function toggleLike(diaryId, btn) {
        try {
            const res = await fetch('/user/diary/toggleLike', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ diaryId }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                const span = btn.querySelector('span');
                let current = parseInt(span.innerText);
                span.innerText = result.liked ? current + 1 : Math.max(current - 1, 0);
            } else { alert('操作失败'); }
        } catch (e) { alert('网络异常'); }
    }

    async function toggleFav(diaryId, btn) {
        try {
            const res = await fetch('/user/diary/toggleFavorite', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ diaryId }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                const span = btn.querySelector('span');
                let current = parseInt(span.innerText);
                span.innerText = result.favorited ? current + 1 : Math.max(current - 1, 0);
                if (currentTab === 'favorite') await loadDiaries('favorite');
            } else { alert('收藏失败'); }
        } catch (e) { alert('网络异常'); }
    }

    async function submitComment(diaryId) {
        const txtArea = document.getElementById(`commentInput-${diaryId}`);
        const content = txtArea.value.trim();
        if (!content) { alert('留言不能为空哟'); return; }
        try {
            const res = await fetch('/user/diary/addComment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ diaryId, content, parentId: 0 }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                txtArea.value = '';
                await loadDiaries(currentTab);
            } else { alert('发布失败：' + (result.msg || '未知')); }
        } catch (e) { alert('网络错误'); }
    }

    async function deleteComment(commentId, diaryId) {
        if (!confirm('删除这条留言吗？')) return;
        try {
            const res = await fetch('/user/diary/deleteComment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ commentId }),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) { await loadDiaries(currentTab); }
            else { alert('删除失败'); }
        } catch (e) { alert('网络异常'); }
    }

    function visitUser(uid) { location.href = `user-info.html?userId=${uid}`; }
    function toUserInfo() { location.href = "user-info.html"; }
    function goToMessage() { location.href = "message.html"; }

    document.querySelectorAll('.side-tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.side-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const type = tab.dataset.type;
            if (type === 'write') { window.location.href = 'write-diary.html'; }
            else { loadDiaries(type); }
        };
    });

    function go(page) {
        const links = { index: "index.html", role: "member.html", record: "diary.html", album: "about.html", map: "travel.html" };
        window.location.href = links[page];
    }

    async function updateRedDot() {
        try {
            const res = await fetch("/user/unreadRequestCount", { credentials: 'include' });
            const result = await res.json();
            const redDot = document.getElementById('redDotDiary');
            if (redDot) { redDot.style.display = (result.code === 200 && result.data > 0) ? 'block' : 'none'; }
        } catch (e) { }
    }

    function showLogoutModal() {
        document.getElementById('logoutModal').style.display = 'flex';
        document.getElementById('switch').classList.add('active');
    }
    function logout() {
        localStorage.clear();
        fetch("/user/logout", { method: "POST", credentials: "include" }).catch(e => console.log);
        location.href = 'login.html';
    }
</script>
</body>
</html>
