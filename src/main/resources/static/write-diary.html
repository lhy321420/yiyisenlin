<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>写下今天 - 壹一森林</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pinyin-pro@3.19.6/dist/index.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fff9f5;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* ========== 顶部导航 手机完美适配 ========== */
        .big {
            display: flex;
            align-items: center;
            background: rgb(255, 255, 158);
            padding: 8px 12px;
            justify-content: space-between;
            margin: 10px auto;
            max-width: 95%;
            border-radius: 15px;
            min-height: 46px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .first { display: flex; align-items: center; gap: 6px; }
        .heart { font-size: 16px; cursor: pointer; transition: 0.2s; }
        .heart:hover { transform: scale(1.1); }
        .name p { font-size: 12px; line-height: 1.2; color: rgb(146, 86, 30); }
        .bell {
            font-size: 18px;
            color: rgb(199, 199, 158);
            cursor: pointer;
            margin-left: 6px;
            transition: 0.3s;
            position: relative;
        }
        .bell:hover { color: #f8446e; }
        .red-dot {
            position: absolute;
            top: -5px;
            right: -8px;
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            display: none;
        }
        .nav {
            display: flex;
            background: rgb(252, 252, 192);
            color: rgb(146, 86, 30);
            padding: 2px 6px;
            border-radius: 15px;
            min-height: 28px;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-item {
            padding: 2px 6px;
            border: 2px solid transparent;
            border-radius: 15px;
            transition: all 0.3s ease;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-item.active {
            background-color: rgb(255, 239, 200);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .nav-item:hover {
            background-color: rgb(255, 239, 200);
            transform: translateY(-1px);
        }
        .user-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffdde0;
            padding: 4px 10px;
            border-radius: 20px;
            color: #c74c70;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .switch-btn {
            width: 28px;
            height: 14px;
            background: #fff;
            border-radius: 10px;
            position: relative;
        }
        .switch-btn::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.2s;
        }

        /* ========== 写日记表单 手机全屏适配 ========== */
        .write-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            width: 100%;
        }
        .write-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(245,190,150,0.15);
        }
        .write-title {
            font-size: 22px;
            color: #c74c70;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #9c5a22;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #f7d3c2;
            border-radius: 16px;
            font-size: 14px;
            background: #fff;
            outline: none;
            transition: 0.2s;
        }
        .form-group select {
            cursor: pointer;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23c74c70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
        }
        .form-group select:hover {
            border-color: #ffb3c1;
            background-color: #fff9f5;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #ffb3c1;
            box-shadow: 0 0 0 3px rgba(255,179,193,0.2);
        }
        .form-group textarea {
            height: 150px;
            resize: vertical;
        }
        .custom-file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .custom-file-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .file-label {
            display: block;
            width: 100%;
            padding: 10px 14px;
            background: #ffdde0;
            color: #c74c70;
            border-radius: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #f7d3c2;
        }
        .file-label:hover {
            background: #ffccd5;
        }
        .photo-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .photo-preview img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #ffe0cc;
        }
        .submit-btn {
            width: 100%;
            padding: 10px;
            background: #ffccd5;
            color: #c74c70;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: #ffb3c1;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #c74c70;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="big">
    <div class="first">
        <div class="heart" onclick="toUserInfo()">❤️</div>
        <div class="name">
            <p>SPACE</p>
            <p>壹一森林</p>
        </div>
        <div class="bell" onclick="goToMessage()">
            <i class="fa-solid fa-bell"></i>
            <span class="red-dot" id="redDot"></span>
        </div>
    </div>
    <div class="nav">
        <div class="nav-item" onclick="go('index')">首页</div>
        <div class="nav-item" onclick="go('role')">朋友</div>
        <div class="nav-item active" onclick="go('record')">记录</div>
        <div class="nav-item" onclick="go('album')">相册</div>
        <div class="nav-item" onclick="go('map')">地图</div>
    </div>
    <div class="user-right" onclick="showLogoutModal()">
        <span id="userInitial">加载中...</span>
        <div class="switch-btn" id="switch"></div>
    </div>
</div>

<div class="write-container">
    <div class="write-card">
        <h1 class="write-title">✨ 写下今天 ✨</h1>
        <div class="form-group">
            <label>📝 标题</label>
            <input type="text" id="diaryTitle" placeholder="给今天一个主题吧">
        </div>
        <div class="form-group">
            <label>💭 内容</label>
            <textarea id="diaryContent" placeholder="记录你的心情、故事..."></textarea>
        </div>
        <div class="form-group">
            <label>🔒 谁可以看</label>
            <select id="diaryPermission">
                <option value="1">仅自己可见</option>
                <option value="3">公开（所有人可见）</option>
            </select>
        </div>
        <div class="form-group">
            <label>📸 上传照片（可多选）</label>
            <div class="custom-file-upload">
                <input type="file" id="diaryPhoto" accept="image/*" multiple>
                <div class="file-label">📷 点击选择照片</div>
            </div>
            <div id="photoPreview" class="photo-preview"></div>
        </div>
        <button id="submitBtn" class="submit-btn">✨ 发布日记 ✨</button>
        <div style="text-align: center;">
            <a href="diary.html" class="back-link">← 返回日记列表</a>
        </div>
    </div>
</div>

<script>
    // 辅助函数
    function showMessage(msg) { alert(msg); }
    function getNameInitials(username) {
        if (!username) return '游客';
        const { pinyin } = window.pinyinPro || window.pinyin;
        if (!pinyin) return username.charAt(0).toUpperCase();
        return username.split('').map(ch => {
            if (/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
            if (/[\u4e00-\u9fa5]/.test(ch)) {
                const py = pinyin(ch, { pattern: 'first', toneType: 'none' });
                return py ? py.toUpperCase() : ch;
            }
            return ch.toUpperCase();
        }).join(' ');
    }

    let photoFiles = [];

    // 照片预览
    document.getElementById('diaryPhoto').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        const preview = document.getElementById('photoPreview');
        preview.innerHTML = '';
        photoFiles = files;
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = document.createElement('img');
                img.src = ev.target.result;
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });

    // 提交日记
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const title = document.getElementById('diaryTitle').value.trim();
        const content = document.getElementById('diaryContent').value.trim();
        const permission = parseInt(document.getElementById('diaryPermission').value);
        if (!title || !content) {
            showMessage('请填写标题和内容');
            return;
        }
        const photosBase64 = [];
        for (let file of photoFiles) {
            const base64 = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
            photosBase64.push(base64);
        }
        const diaryData = {
            title, content, permission,
            photos: JSON.stringify(photosBase64)
        };
        try {
            const res = await fetch('/user/diary/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(diaryData),
                credentials: 'include'
            });
            const result = await res.json();
            if (result.code === 200) {
                showMessage('发布成功！');
                window.location.href = 'diary.html';
            } else {
                showMessage('发布失败：' + (result.msg || '未知错误'));
            }
        } catch(e) {
            console.error(e);
            showMessage('网络错误，请稍后重试');
        }
    });

    // 初始化用户信息和红点
    window.onload = async function() {
        if (!localStorage.getItem('isLogin')) {
            location.href = 'login.html';
            return;
        }
        try {
            const res = await fetch("/user/info", { method: "GET", credentials: "include" });
            const result = await res.json();
            if (result.code === 200 && result.data && result.data.username) {
                const initials = getNameInitials(result.data.username);
                document.getElementById('userInitial').innerText = initials;
                localStorage.setItem('username', result.data.username);
            } else {
                localStorage.removeItem('isLogin');
                location.href = 'login.html';
                return;
            }
        } catch(err) {
            console.error(err);
            localStorage.removeItem('isLogin');
            location.href = 'login.html';
            return;
        }
        await updateRedDot();
    };

    async function updateRedDot() {
        try {
            const res = await fetch("/user/unreadNotificationCount", { method: "GET", credentials: "include" });
            const result = await res.json();
            const redDot = document.getElementById('redDot');
            if (result.code === 200 && result.data > 0) redDot.style.display = 'block';
            else redDot.style.display = 'none';
        } catch(e) { console.error(e); }
    }

    function toUserInfo() { location.href = "user-info.html"; }
    function goToMessage() { window.location.href = "message.html"; }
    function go(page) {
        const links = { index:"index.html", role:"member.html", record:"diary.html", album:"about.html", map:"travel.html" };
        window.location.href = links[page];
    }
    function showLogoutModal() {
        if (confirm('确定退出登录吗？')) {
            localStorage.removeItem('isLogin');
            localStorage.removeItem('username');
            fetch("/user/logout", { method: "POST", credentials: "include" }).catch(e=>console.log);
            location.href = 'login.html';
        }
    }
</script>
</body>
</html>
