<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>消息中心 - 壹一森林</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pinyin-pro@3.19.6/dist/index.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #fff9f5;
            font-family: system-ui, "Microsoft YaHei", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* ========== 顶部导航 手机完美适配（与统一样式完全一致） ========== */
        .big {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgb(255, 255, 158);
            margin: 12px auto;
            padding: 10px 14px;
            width: calc(100% - 20px);
            max-width: 1000px;
            border-radius: 28px;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .first {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .heart {
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255, 220, 180, 0.4);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .heart:active {
            transform: scale(0.94);
            background: #ffe0b5;
        }

        .name p {
            font-size: 11px;
            line-height: 1.25;
            color: rgb(146, 86, 30);
            font-weight: 500;
        }

        .name p:first-child {
            font-size: 10px;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .bell {
            font-size: 20px;
            color: rgb(199, 199, 158);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            background: rgba(255, 240, 200, 0.5);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .bell:active {
            transform: scale(0.94);
            color: #f8446e;
        }

        .red-dot {
            position: absolute;
            top: 2px;
            right: 4px;
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            display: none;
            border: 1.5px solid #ffff9e;
        }

        /* 导航菜单 完全自适应换行 */
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: rgb(252, 252, 192);
            padding: 6px 12px;
            border-radius: 40px;
            flex: 1 1 auto;
            min-width: 160px;
        }

        .nav-item {
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: rgb(146, 86, 30);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            background: transparent;
            text-align: center;
        }

        .nav-item.active {
            background-color: rgb(255, 239, 200);
            color: #bc6f2c;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .nav-item:active {
            background-color: rgb(255, 230, 180);
            transform: scale(0.96);
        }

        .user-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffdde0;
            padding: 6px 12px;
            border-radius: 40px;
            color: #c74c70;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .user-right:active {
            background: #ffcbd1;
            transform: scale(0.97);
        }

        .switch-btn {
            width: 28px;
            height: 14px;
            background: #fff;
            border-radius: 10px;
            position: relative;
        }

        .switch-btn::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }

        @media (max-width: 620px) {
            .big {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
                gap: 10px;
            }
            .first {
                justify-content: space-between;
                width: 100%;
            }
            .nav {
                width: 100%;
                justify-content: center;
            }
            .user-right {
                align-self: flex-end;
                width: fit-content;
            }
            .nav-item {
                padding: 6px 10px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .nav-item {
                padding: 5px 8px;
                font-size: 12px;
            }
            .first .heart,
            .first .bell {
                width: 32px;
                height: 32px;
            }
        }

        /* ========== 退出弹窗 ========== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1200;
            padding: 16px;
        }
        .modal-content {
            background: #fffef8;
            width: 90%;
            max-width: 280px;
            padding: 22px;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
        }
        .modal-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: #9c5a22;
            font-weight: 600;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal-btn {
            padding: 6px 18px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            min-width: 80px;
            font-weight: 500;
        }
        .cancel {
            background: #f1f1f1;
            color: #6b4c2c;
        }
        .logout {
            background: #f8446e;
            color: #fff;
        }

        /* ========== 消息页面 手机全屏 ========== */
        .message-container {
            max-width: 800px;
            margin: 20px auto 50px;
            padding: 0 16px;
            width: 100%;
        }
        .message-title {
            font-size: 26px;
            font-weight: 800;
            color: #e67a8a;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab {
            padding: 8px 18px;
            border-radius: 40px;
            background: #f0e0d0;
            color: #9c5a22;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            font-weight: 600;
            border: none;
        }
        .tab.active {
            background: #e67a8a;
            color: #fff;
            box-shadow: 0 2px 6px rgba(230,122,138,0.3);
        }
        .tab:active {
            transform: scale(0.96);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #9c5a22;
            margin: 20px 0 10px;
            padding-left: 12px;
            border-left: 4px solid #e67a8a;
        }

        .message-list, .request-list {
            background: #fff;
            border-radius: 28px;
            padding: 8px;
            box-shadow: 0 6px 18px rgba(245, 190, 150, 0.08);
            margin-bottom: 20px;
        }
        .message-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border-bottom: 1px solid #f0d8c0;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 20px;
        }
        .message-item:last-child {
            border-bottom: none;
        }
        .message-item:active {
            background: #fffaf5;
            transform: scale(0.99);
        }
        .message-item.unread {
            background: #fff0e8;
        }

        .module-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            background: #ffe8e0;
        }
        .module-icon.friend { background: #e3f2fd; }
        .module-icon.record { background: #e8f5e9; }
        .module-icon.album { background: #fff3e0; }
        .module-icon.map { background: #fce4ec; }

        .message-info {
            flex: 1;
            min-width: 0;
        }
        .message-text {
            font-size: 14px;
            color: #5a3a1a;
            margin-bottom: 6px;
            line-height: 1.4;
            word-break: break-word;
        }
        .message-from {
            font-size: 12px;
            color: #e67a8a;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .message-time {
            font-size: 10px;
            color: #b99a7a;
        }
        .unread-dot {
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .no-messages {
            text-align: center;
            padding: 40px 16px;
            color: #b7865c;
            font-size: 14px;
        }

        /* 好友申请列表 */
        .request-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            border-bottom: 1px solid #f0d8c0;
            flex-wrap: wrap;
            gap: 12px;
        }
        .request-item:last-child {
            border-bottom: none;
        }
        .request-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 160px;
        }
        .request-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #ffe8e8;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .request-name {
            font-size: 15px;
            font-weight: 700;
            color: #9c5a22;
        }
        .request-time {
            font-size: 11px;
            color: #b99a7a;
            margin-top: 4px;
        }
        .request-buttons {
            display: flex;
            gap: 10px;
        }
        .request-buttons button {
            padding: 7px 18px;
            border-radius: 40px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
        }
        .request-buttons button:active {
            transform: scale(0.95);
        }
        .accept-btn {
            background: #7ccd7c;
            color: #fff;
        }
        .reject-btn {
            background: #e0cfc0;
            color: #5e3a22;
        }
    </style>
</head>
<body>

<!-- 导航栏：统一完美适配 -->
<div class="big">
    <div class="first">
        <div class="heart" onclick="toUserInfo()">❤️</div>
        <div class="name">
            <p>SPACE</p>
            <p>壹一森林</p>
        </div>
        <div class="bell" onclick="goToMessage()">
            <i class="fa-solid fa-bell"></i>
            <span class="red-dot" id="redDot"></span>
        </div>
    </div>
    <div class="nav">
        <div class="nav-item" onclick="go('index')"><strong>首页</strong></div>
        <div class="nav-item" onclick="go('role')"><strong>朋友</strong></div>
        <div class="nav-item" onclick="go('record')"><strong>记录</strong></div>
        <div class="nav-item" onclick="go('album')"><strong>相册</strong></div>
        <div class="nav-item" onclick="go('map')"><strong>地图</strong></div>
    </div>
    <div class="user-right" onclick="showLogoutModal()">
        <span id="userInitial">加载中...</span>
        <div class="switch-btn" id="switch"></div>
    </div>
</div>

<!-- 退出弹窗 -->
<div class="modal" id="logoutModal">
    <div class="modal-content">
        <div class="modal-title">确定要退出登录吗？</div>
        <div class="modal-btns">
            <button class="modal-btn cancel" onclick="closeModal()">取消</button>
            <button class="modal-btn logout" onclick="logout()">退出</button>
        </div>
    </div>
</div>

<div class="message-container">
    <h1 class="message-title">📬 消息中心</h1>

    <div class="tabs">
        <button class="tab active" data-module="all">全部</button>
        <button class="tab" data-module="friend">👥 朋友</button>
        <button class="tab" data-module="record">📝 记录</button>
        <button class="tab" data-module="album">📷 相册</button>
        <button class="tab" data-module="map">🗺️ 地图</button>
    </div>

    <div class="section-title">📢 互动通知</div>
    <div class="message-list" id="notificationList">
        <div class="no-messages">加载中...</div>
    </div>

    <div class="section-title">👫 好友申请</div>
    <div class="request-list" id="requestList">
        <div class="no-messages">加载中...</div>
    </div>
</div>

<script>
    // ==================== 辅助函数 ====================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    function showMessage(msg) { alert(msg); }

    function closeModal() {
        document.getElementById('logoutModal').style.display = 'none';
        const switchBtn = document.getElementById('switch');
        if (switchBtn) switchBtn.classList.remove('active');
    }

    function formatTime(timeStr) {
        if (!timeStr) return '';
        try {
            let date = new Date(timeStr);
            let now = new Date();
            let diff = now - date;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            return date.toLocaleDateString();
        } catch(e) {
            return timeStr;
        }
    }

    function getModuleIcon(module) {
        switch(module) {
            case 'friend': return '👥';
            case 'record': return '📝';
            case 'album': return '📷';
            case 'map': return '🗺️';
            default: return '📢';
        }
    }

    function getModuleName(module) {
        switch(module) {
            case 'friend': return '朋友';
            case 'record': return '记录';
            case 'album': return '相册';
            case 'map': return '地图';
            default: return '通知';
        }
    }

    function getNameInitials(username) {
        if (!username) return '游客';
        const { pinyin } = window.pinyinPro || window.pinyin;
        if (!pinyin) return username.charAt(0).toUpperCase();
        return username.split('').map(ch => {
            if (/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
            if (/[\u4e00-\u9fa5]/.test(ch)) {
                const py = pinyin(ch, { pattern: 'first', toneType: 'none' });
                return py ? py.toUpperCase() : ch;
            }
            return ch.toUpperCase();
        }).join(' ');
    }

    // ==================== 导航跳转逻辑 ====================
    function navigateByNotification(notif) {
        const module = notif.module;
        const type = notif.type;
        const targetId = notif.targetId;
        let jumpUrl = '';
        switch(module) {
            case 'album':
                jumpUrl = 'about.html';
                break;
            case 'record':
                if (targetId && ['NEW_DIARY', 'LIKE', 'COMMENT', 'REPLY'].includes(type)) {
                    jumpUrl = `diary-detail.html?id=${targetId}`;
                } else {
                    jumpUrl = 'diary.html';
                }
                break;
            case 'map':
                jumpUrl = 'travel.html';
                break;
            case 'friend':
                jumpUrl = 'member.html';
                break;
            default:
                if (targetId && ['LIKE', 'COMMENT', 'REPLY'].includes(type)) {
                    jumpUrl = `diary-detail.html?id=${targetId}`;
                } else {
                    jumpUrl = 'index.html';
                }
                break;
        }
        location.href = jumpUrl;
    }

    let notifications = [];
    let currentModule = 'all';

    // 点击通知（标记已读并跳转）
    window.handleNotificationClick = async function(notificationId) {
        const notif = notifications.find(n => n.id === notificationId);
        if (!notif) {
            showMessage('该消息已不存在');
            return;
        }
        // 标记已读
        try {
            const res = await fetch("/user/notification/read", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: notif.id }),
                credentials: "include"
            });
            notif.isRead = 1;
            renderNotifications();
        } catch (err) { console.error(err); }

        const cannotJumpTypes = ['DELETED', 'DELETE', 'NEW_PHOTO', 'PHOTO'];
        if (cannotJumpTypes.includes(notif.type)) {
            showMessage('该内容已删除或不支持跳转');
            return;
        }
        navigateByNotification(notif);
    };

    async function loadNotifications() {
        try {
            const res = await fetch("/user/notifications", { method: "GET", credentials: "include" });
            const result = await res.json();
            const container = document.getElementById('notificationList');
            if (result.code === 200 && result.data && result.data.length > 0) {
                notifications = result.data;
                renderNotifications();
            } else {
                container.innerHTML = '<div class="no-messages">暂无互动消息</div>';
                notifications = [];
            }
        } catch (err) {
            document.getElementById('notificationList').innerHTML = '<div class="no-messages">加载失败，请检查网络</div>';
        }
    }

    function renderNotifications() {
        const container = document.getElementById('notificationList');
        let filtered = currentModule === 'all' ? notifications : notifications.filter(n => n.module === currentModule);
        if (!filtered || filtered.length === 0) {
            container.innerHTML = '<div class="no-messages">暂无消息</div>';
            return;
        }
        container.innerHTML = filtered.map(notif => `
            <div class="message-item ${notif.isRead === 0 ? 'unread' : ''}" onclick="handleNotificationClick(${notif.id})">
                <div class="module-icon ${notif.module || 'friend'}">
                    ${getModuleIcon(notif.module)}
                </div>
                <div class="message-info">
                    <div class="message-from">${escapeHtml(notif.fromUsername || '用户')} · ${getModuleName(notif.module)}</div>
                    <div class="message-text">${escapeHtml(notif.content)}</div>
                    <div class="message-time">${formatTime(notif.createTime)}</div>
                </div>
                ${notif.isRead === 0 ? '<div class="unread-dot"></div>' : ''}
            </div>
        `).join('');
    }

    // 好友申请
    async function loadFriendRequests() {
        try {
            const res = await fetch("/user/pendingRequests", { method: "GET", credentials: "include" });
            const result = await res.json();
            const container = document.getElementById('requestList');
            if (result.code === 200 && result.data && result.data.length > 0) {
                let html = '';
                for (let req of result.data) {
                    let avatarStyle = req.avatar && req.avatar.startsWith('data:image')
                        ? `style="background-image: url('${escapeHtml(req.avatar)}'); background-size: cover; background-position: center;"`
                        : '';
                    html += `
                        <div class="request-item" data-id="${req.id}">
                            <div class="request-info">
                                <div class="request-avatar" ${avatarStyle}></div>
                                <div>
                                    <div class="request-name">${escapeHtml(req.username)}</div>
                                    <div class="request-time">申请添加好友</div>
                                </div>
                            </div>
                            <div class="request-buttons">
                                <button class="accept-btn" onclick="handleFriendRequest(${req.id}, 'accept', this)">接受</button>
                                <button class="reject-btn" onclick="handleFriendRequest(${req.id}, 'reject', this)">拒绝</button>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="no-messages">暂无好友申请</div>';
            }
        } catch (err) {
            document.getElementById('requestList').innerHTML = '<div class="no-messages">加载失败</div>';
        }
    }

    window.handleFriendRequest = async function(requestId, action, btnElement) {
        const url = action === 'accept' ? "/user/acceptRequest" : "/user/rejectRequest";
        try {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ requestId }),
                credentials: "include"
            });
            const result = await res.json();
            if (result.code === 200) {
                showMessage(action === 'accept' ? "✅ 已添加好友" : "已拒绝申请");
                const item = btnElement.closest('.request-item');
                if (item) item.remove();
                if (document.querySelectorAll('.request-item').length === 0) {
                    document.getElementById('requestList').innerHTML = '<div class="no-messages">暂无好友申请</div>';
                }
                // 更新红点
                await updateTotalRedDot();
            } else {
                showMessage("操作失败：" + (result.msg || "未知错误"));
            }
        } catch (err) {
            showMessage("网络错误");
        }
    };

    // 红点更新（未读通知+未读申请）
    async function updateTotalRedDot() {
        try {
            const notifRes = await fetch("/user/unreadNotificationCount", { method: "GET", credentials: "include" });
            const notifResult = await notifRes.json();
            let unreadCount = notifResult.code === 200 ? (notifResult.data || 0) : 0;

            const requestRes = await fetch("/user/unreadRequestCount", { method: "GET", credentials: "include" });
            const requestResult = await requestRes.json();
            let requestCount = requestResult.code === 200 ? (requestResult.data || 0) : 0;

            const totalUnread = unreadCount + requestCount;
            const redDot = document.getElementById('redDot');
            if (redDot) redDot.style.display = totalUnread > 0 ? 'block' : 'none';
        } catch (err) { console.error(err); }
    }

    function setupTabs() {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentModule = tab.getAttribute('data-module');
                renderNotifications();
            });
        });
    }

    // 页面初始化
    window.onload = async function() {
        if (!localStorage.getItem('isLogin')) {
            location.href = 'login.html';
            return;
        }
        try {
            const res = await fetch("/user/info", { method: "GET", credentials: "include" });
            const result = await res.json();
            if (result.code === 200 && result.data && result.data.username) {
                const initials = getNameInitials(result.data.username);
                document.getElementById('userInitial').innerText = initials;
                localStorage.setItem('username', result.data.username);
            } else {
                localStorage.removeItem('isLogin');
                location.href = 'login.html';
                return;
            }
        } catch (err) {
            console.error(err);
            localStorage.removeItem('isLogin');
            location.href = 'login.html';
            return;
        }
        await Promise.all([loadNotifications(), loadFriendRequests()]);
        setupTabs();
        await updateTotalRedDot();
        setInterval(updateTotalRedDot, 30000);
    };

    // 导航栏函数
    function toUserInfo() { location.href = "user-info.html"; }
    function goToMessage() { location.href = "message.html"; }
    function go(page) {
        const links = { index: "index.html", role: "member.html", record: "diary.html", album: "about.html", map: "travel.html" };
        window.location.href = links[page];
    }
    function showLogoutModal() {
        document.getElementById('logoutModal').style.display = 'flex';
        const switchBtn = document.getElementById('switch');
        if (switchBtn) switchBtn.classList.add('active');
    }
    function logout() {
        localStorage.clear();
        fetch("/user/logout", { method: "POST", credentials: "include" }).catch(e => {});
        location.href = 'login.html';
    }
</script>
</body>
</html>
