<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>壹一森林 - 足迹地图</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/pinyin-pro/3.18.2/index.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #fff9f5; font-family: system-ui, "Microsoft YaHei", sans-serif; overflow-x: hidden; }

        .big {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgb(255, 255, 158);
            margin: 12px auto;
            padding: 10px 14px;
            width: calc(100% - 20px);
            max-width: 1000px;
            border-radius: 28px;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }
        .first { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .heart {
            font-size: 20px;
            cursor: pointer;
            background: rgba(255, 220, 180, 0.4);
            width: 34px; height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .heart:active { transform: scale(0.94); background: #ffe0b5; }
        .name p { font-size: 11px; line-height: 1.25; color: rgb(146, 86, 30); font-weight: 500; }
        .name p:first-child { font-size: 10px; letter-spacing: 0.5px; opacity: 0.8; }
        .bell {
            font-size: 20px;
            color: rgb(199, 199, 158);
            cursor: pointer;
            background: rgba(255, 240, 200, 0.5);
            width: 34px; height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            position: relative;
        }
        .bell:active { transform: scale(0.94); color: #f8446e; }
        .red-dot {
            position: absolute;
            top: 2px; right: 4px;
            width: 10px; height: 10px;
            background: #f8446e;
            border-radius: 50%;
            display: none;
            border: 1.5px solid #ffff9e;
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: rgb(252, 252, 192);
            padding: 6px 12px;
            border-radius: 40px;
            flex: 1 1 auto;
            min-width: 160px;
        }
        .nav-item {
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: rgb(146, 86, 30);
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-item.active { background-color: rgb(255, 239, 200); color: #bc6f2c; transform: translateY(-1px); }
        .nav-item:active { background-color: rgb(255, 230, 180); transform: scale(0.96); }
        .user-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffdde0;
            padding: 6px 12px;
            border-radius: 40px;
            color: #c74c70;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .user-right:active { background: #ffcbd1; transform: scale(0.97); }
        .switch-btn { width: 28px; height: 14px; background: #fff; border-radius: 10px; position: relative; }
        .switch-btn::before {
            content: '';
            width: 10px; height: 10px;
            background: #f8446e;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        @media (max-width: 620px) {
            .big { flex-direction: column; align-items: stretch; padding: 12px; gap: 10px; }
            .first { justify-content: space-between; width: 100%; }
            .nav { width: 100%; justify-content: center; }
            .user-right { align-self: flex-end; width: fit-content; }
            .nav-item { padding: 6px 10px; font-size: 13px; }
        }
        @media (max-width: 480px) {
            .nav-item { padding: 5px 8px; font-size: 12px; }
            .first .heart, .first .bell { width: 32px; height: 32px; }
        }

        .filter-bar {
            max-width: 1000px;
            margin: 20px auto 12px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            background: #fffaf5;
            border-radius: 32px;
            width: calc(100% - 30px);
        }
        .filter-title { font-size: 20px; color: #e67a8a; font-weight: 700; }
        .filter-select {
            padding: 8px 14px;
            border: 1px solid #f0d8c0;
            border-radius: 40px;
            outline: none;
            font-size: 14px;
            background: #fff;
        }
        .filter-btn {
            padding: 8px 20px;
            background: #ffccd5;
            color: #c74c70;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .filter-btn:active { background: #ffb8c4; transform: scale(0.96); }
        .stats-bar {
            max-width: 1000px;
            margin: 0 auto 15px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            background: #fff0e0;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #a55b2a;
            flex-wrap: wrap;
            width: calc(100% - 30px);
        }
        .stat-badge { display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .stat-color { width: 14px; height: 14px; border-radius: 20px; }

        .map-wrap {
            max-width: 1000px;
            margin: 0 auto 15px;
            padding: 0 15px;
            position: relative;
        }
        #chinaMap {
            width: 100%;
            height: 520px;
            border-radius: 28px;
            border: 2px solid #ffccd5;
            background: #e8f0f5;
            z-index: 1;
        }
        @media (max-width: 768px) { #chinaMap { height: 440px; } }

        .city-list-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            background: #fffef8;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 6px 18px rgba(255, 204, 213, 0.25);
            border: 1px solid #ffccd5;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        @media (max-width: 550px) { .city-list-panel { display: none; } }
        .city-list-title { text-align: center; color: #c74c70; font-weight: 800; margin-bottom: 10px; font-size: 13px; }
        .city-list-item {
            padding: 6px 10px;
            background: #fff9f5;
            border-radius: 20px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #9c5a22;
            border-left: 3px solid #ffccd5;
            cursor: pointer;
        }
        .city-list-item:active { background: #ffede5; }
        .desc-tips {
            max-width: 1000px;
            margin: 10px auto 30px;
            padding: 12px 18px;
            text-align: center;
            color: #9c5a22;
            font-size: 12px;
            background: #fff2e6;
            border-radius: 40px;
            width: calc(100% - 30px);
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1200;
            padding: 16px;
        }
        .modal-content {
            background: #fffef8;
            width: 90%;
            max-width: 280px;
            padding: 22px;
            border-radius: 32px;
            text-align: center;
        }
        .modal-content h3 { color: #9c5a22; margin-bottom: 15px; }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .modal-btn {
            padding: 6px 18px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            min-width: 80px;
            font-weight: 500;
        }
        .cancel { background: #f1f1f1; color: #6b4c2c; }
        .logout { background: #f8446e; color: #fff; }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7d9c4;
            color: #a3442e;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 1100;
            pointer-events: none;
        }
        .city-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1300;
            padding: 15px;
        }
        .city-card {
            background: #fffaf2;
            border-radius: 32px;
            width: 100%;
            max-width: 360px;
            padding: 24px 20px;
            text-align: center;
            border: 1px solid #ffddb0;
            animation: fadeInUp 0.2s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .city-title { font-size: 24px; font-weight: 800; color: #c74c70; margin-bottom: 16px; border-bottom: 2px dashed #ffccd5; padding-bottom: 10px; }
        .state-group { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .state-btn {
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .state-btn:active { transform: scale(0.95); }
        .func-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .func-btn {
            background: #ffdde0;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            color: #b94e6e;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .func-btn:active { background: #ffccd5; transform: scale(0.97); }
        .close-card-btn {
            margin-top: 18px;
            padding: 10px 24px;
            background: #ffe0d4;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            color: #b3623a;
            font-size: 14px;
            font-weight: 600;
        }
        .close-card-btn:active { background: #ffd0c0; transform: scale(0.96); }

        .province-tooltip {
            font-size: 12px;
            font-weight: bold;
            padding: 4px 8px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="big">
    <div class="first">
        <div class="heart" onclick="toUserInfo()">❤️</div>
        <div class="name"><p>SPACE</p><p>壹一森林</p></div>
        <div class="bell" onclick="goToMessage()">
            <i class="fa-solid fa-bell"></i>
            <span class="red-dot" id="redDot"></span>
        </div>
    </div>
    <div class="nav">
        <div class="nav-item" onclick="go('index')"><strong>首页</strong></div>
        <div class="nav-item" onclick="go('role')"><strong>朋友</strong></div>
        <div class="nav-item" onclick="go('record')"><strong>记录</strong></div>
        <div class="nav-item" onclick="go('album')"><strong>相册</strong></div>
        <div class="nav-item active" onclick="go('map')"><strong>地图</strong></div>
    </div>
    <div class="user-right" onclick="showLogoutModal()">
        <span id="userInitial">加载中...</span>
        <div class="switch-btn" id="switch"></div>
    </div>
</div>

<div class="filter-bar">
    <span class="filter-title">🗺️ 足迹地图</span>
    <select class="filter-select" id="stateFilterSelect">
        <option value="all">全部状态</option>
        <option value="go">✅ 已去过</option>
        <option value="want">💗 想去打卡</option>
    </select>
    <button class="filter-btn" id="filterQueryBtn">筛选查询</button>
</div>

<div class="stats-bar">
    <div class="stat-badge"><span class="stat-color" style="background:#7ccd7c;"></span> <span id="goCount">0</span> 已去过</div>
    <div class="stat-badge"><span class="stat-color" style="background:#ff4a6c;"></span> <span id="wantCount">0</span> 想去</div>
</div>

<div class="map-wrap">
    <div id="chinaMap"></div>
    <div class="city-list-panel">
        <div class="city-list-title">📍 我的足迹</div>
        <div id="cityListContent"></div>
    </div>
</div>
<div class="desc-tips">💡 点击地图上的省份区域 → 标记去过/想去 | 上传相册 📸 | 写记录 ✍️ | 发攻略 📖</div>

<div class="modal" id="logoutModal">
    <div class="modal-content"><h3>确定退出登录？</h3>
        <div class="modal-btns"><button class="modal-btn cancel" onclick="closeModal()">取消</button><button class="modal-btn logout" onclick="logout()">退出</button></div>
    </div>
</div>

<script>
    // ==================== 工具函数 ====================
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }

    function getNameInitials(username) {
        if (!username) return '游客';
        if (typeof pinyinPro !== 'undefined' && pinyinPro.pinyin) {
            return username.split('').map(ch => {
                if (/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
                if (/[\u4e00-\u9fa5]/.test(ch)) {
                    const py = pinyinPro.pinyin(ch, { pattern: 'first', toneType: 'none' });
                    return py ? py.toUpperCase() : ch;
                }
                return ch.toUpperCase();
            }).join('');
        }
        return username.charAt(0).toUpperCase();
    }

    function closeModal() { document.getElementById('logoutModal').style.display = 'none'; document.getElementById('switch')?.classList.remove('active'); }
    function showLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; document.getElementById('switch')?.classList.add('active'); }
    async function logout() { localStorage.clear(); await fetch("/user/logout", { method: "POST", credentials: "include" }).catch(e=>{}); location.href = 'login.html'; }
    async function updateRedDot() { try { const res = await fetch("/user/unreadRequestCount", { credentials: "include" }); const result = await res.json(); const rd = document.getElementById('redDot'); if(rd) rd.style.display = (result.code === 200 && result.data > 0) ? 'block' : 'none'; } catch(e){} }
    function toastMsg(msg) { let t = document.querySelector('.toast-msg'); if(t) t.remove(); let d = document.createElement('div'); d.className = 'toast-msg'; d.innerText = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2000); }
    function toUserInfo() { location.href = "user-info.html"; }
    function goToMessage() { location.href = "message.html"; }
    function go(page) { const links = { index:"index.html", role:"member.html", record:"diary.html", album:"about.html", map:"travel.html" }; location.href = links[page]; }

    // ==================== 地图状态核心 ====================
    let regionStatus = {}, map, regionLayers = {}, currentFilter = 'all';

    const provinceCapitals = {
        "北京市": [39.9042, 116.4074], "天津市": [39.1256, 117.1902], "上海市": [31.2304, 121.4737], "重庆市": [29.5582, 106.5044],
        "河北省": [38.0423, 114.5149], "山西省": [37.8703, 112.5624], "内蒙古自治区": [40.8175, 111.7656],
        "辽宁省": [41.8056, 123.4315], "吉林省": [43.8868, 125.3245], "黑龙江省": [45.7567, 126.6424],
        "江苏省": [32.0415, 118.7674], "浙江省": [30.2875, 120.1536], "安徽省": [31.8612, 117.2830],
        "福建省": [26.0753, 119.3062], "江西省": [28.6765, 115.8922], "山东省": [36.6758, 117.0009],
        "河南省": [34.7570, 113.6654], "湖北省": [30.5844, 114.2986], "湖南省": [28.1941, 112.9823],
        "广东省": [23.1291, 113.2644], "广西壮族自治区": [22.8287, 108.3285], "海南省": [20.0174, 110.3489],
        "四川省": [30.6595, 104.0657], "贵州省": [26.5783, 106.7135], "云南省": [25.0406, 102.7123],
        "西藏自治区": [29.6472, 91.1175], "陕西省": [34.2632, 108.9480], "甘肃省": [36.0580, 103.8236],
        "青海省": [36.6224, 101.7806], "宁夏回族自治区": [38.4667, 106.1957], "新疆维吾尔自治区": [43.7928, 87.6177],
        "台湾省": [25.0443, 121.5091], "香港特别行政区": [22.3200, 114.1734], "澳门特别行政区": [22.1868, 113.5430]
    };

    function getRegionStyle(status) {
        switch(status) {
            case 'go': return { color: '#2E8B57', weight: 1.5, fillColor: '#7ccd7c', fillOpacity: 0.65 };
            case 'want': return { color: '#ff476b', weight: 1.5, fillColor: '#ff6b8c', fillOpacity: 0.55 };
            default: return { color: '#c4b5a6', weight: 1, fillColor: '#e8e0d8', fillOpacity: 0.35 };
        }
    }

    function updateRegionStyle(regionName, status) {
        if(!regionLayers[regionName]) return;
        regionLayers[regionName].setStyle(getRegionStyle(status));
        saveStatus();
    }

    function updateStats() {
        let go=0, want=0;
        for(let r in regionStatus) {
            if(regionStatus[r]==='go') go++;
            else if(regionStatus[r]==='want') want++;
        }
        document.getElementById('goCount').innerText = go;
        document.getElementById('wantCount').innerText = want;
        renderRegionList();
    }

    function saveStatus() {
        localStorage.setItem('region_status_data', JSON.stringify(regionStatus));
        updateStats();
    }

    function loadStatus() {
        const saved = localStorage.getItem('region_status_data');
        if(saved) regionStatus = JSON.parse(saved);
    }

    function renderRegionList() {
        let list = [];
        for(let name in regionStatus) {
            let st = regionStatus[name];
            if(currentFilter === 'all') list.push({name, st});
            else if(currentFilter === 'go' && st === 'go') list.push({name, st});
            else if(currentFilter === 'want' && st === 'want') list.push({name, st});
        }
        let html = list.length === 0 ? '<div style="text-align:center;color:#b7855b;padding:10px;">暂无足迹</div>' :
            list.map(item => `<div class="city-list-item" style="border-left-color:${item.st === 'go' ? '#7ccd7c' : '#ffb3c1'}" onclick="openRegionPanelFromList('${escapeHtml(item.name)}')">${escapeHtml(item.name)}</div>`).join('');
        document.getElementById('cityListContent').innerHTML = html;
    }

    window.openRegionPanelFromList = function(regionName) { openRegionPanel(regionName, regionName); };

    window.openRegionAction = function(regionName, provinceName, actionType) {
        let targetUrl = `city-detail.html?city=${encodeURIComponent(regionName)}&province=${encodeURIComponent(provinceName)}`;
        if(actionType === 'album') targetUrl += `&tab=album`;
        else if(actionType === 'diary') targetUrl += `&tab=record`;
        else if(actionType === 'strategy') targetUrl += `&tab=strategy`;
        window.location.href = targetUrl;
    };

    window.setRegionStatus = function(regionName, statusType, provinceName) {
        if(statusType === 'go') {
            regionStatus[regionName] = 'go';
            updateRegionStyle(regionName, 'go');
            toastMsg(`✅ ${regionName} 标记为已去过`);
        }
        else if(statusType === 'want') {
            regionStatus[regionName] = 'want';
            updateRegionStyle(regionName, 'want');
            toastMsg(`💗 ${regionName} 加入想去清单`);
        }
        else {
            delete regionStatus[regionName];
            updateRegionStyle(regionName, null);
            toastMsg(`🔄 ${regionName} 状态已清空`);
        }
        document.querySelector('.city-modal')?.remove();
    };

    function openRegionPanel(regionName, provinceName) {
        document.querySelectorAll('.city-modal').forEach(e => e.remove());
        const modal = document.createElement('div'); modal.className = 'city-modal';
        modal.innerHTML = `
            <div class="city-card">
                <div class="city-title">🏞️ ${escapeHtml(regionName)}</div>
                <div class="state-group">
                    <button class="state-btn" style="background:#7ccd7c;color:#fff" onclick="window.setRegionStatus('${regionName}','go','${provinceName}')">✅ 已去过</button>
                    <button class="state-btn" style="background:#ff4a6c;color:#fff" onclick="window.setRegionStatus('${regionName}','want','${provinceName}')">💗 想去</button>
                    <button class="state-btn" style="background:#d4c5b8;color:#5e3a22" onclick="window.setRegionStatus('${regionName}','clear','${provinceName}')">🔄 取消</button>
                </div>
                <div class="func-group">
                    <button class="func-btn" onclick="window.openRegionAction('${regionName}','${provinceName}','album')">📸 上传相册</button>
                    <button class="func-btn" onclick="window.openRegionAction('${regionName}','${provinceName}','diary')">✍️ 写记录</button>
                    <button class="func-btn" onclick="window.openRegionAction('${regionName}','${provinceName}','strategy')">📖 发攻略</button>
                </div>
                <button class="close-card-btn" onclick="this.closest('.city-modal').remove()">关闭</button>
            </div>`;
        document.body.appendChild(modal);
        modal.onclick = e => e.target === modal && modal.remove();
    }

    function applyFilter() {
        currentFilter = document.getElementById('stateFilterSelect').value;
        for(let name in regionLayers) {
            const st = regionStatus[name];
            const shouldShow = currentFilter === 'all' || currentFilter === st;
            regionLayers[name].setStyle({ opacity: shouldShow ? 1 : 0.15 });
        }
        renderRegionList();
        toastMsg('✅ 筛选完成');
    }

    // ========== 加载GeoJSON省级边界数据 ==========
    async function loadRegionBoundaries() {
        toastMsg('🌏 加载中国地图数据...');
        const localGeoJsonUrl = '/geo/china.json';
        const fallbackUrl = 'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json';

        try {
            let response = await fetch(localGeoJsonUrl);
            if (!response.ok) {
                console.warn('本地GeoJSON文件不存在，尝试备用CDN...');
                response = await fetch(fallbackUrl);
            }
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            for(let k in regionLayers) if(regionLayers[k]) map.removeLayer(regionLayers[k]);
            regionLayers = {};

            let features = data.features;
            if (data.features && data.features[0]?.properties?.level) {
                features = data.features.filter(f => f.properties.level === 'province');
            }

            const nameMapping = {
                '广西壮族自治区': '广西', '新疆维吾尔自治区': '新疆', '宁夏回族自治区': '宁夏',
                '西藏自治区': '西藏', '内蒙古自治区': '内蒙古'
            };

            features.forEach(feature => {
                let name = feature.properties.name;
                const mappedName = nameMapping[name] || name;
                const status = regionStatus[mappedName] || regionStatus[name];
                const style = getRegionStyle(status);

                const layer = L.geoJSON(feature, { style: style, interactive: true }).addTo(map);
                layer.bindTooltip(name, { permanent: false, direction: 'center', className: 'province-tooltip' });
                layer.on('click', () => openRegionPanel(mappedName, name));

                regionLayers[name] = layer;
                if (mappedName !== name) regionLayers[mappedName] = layer;
            });

            updateStats();
            toastMsg('✅ 地图加载完成，点击省份即可记录足迹');
        } catch(error) {
            console.error('加载地图数据失败:', error);
            toastMsg('地图加载失败，请检查网络后刷新');
        }
    }

    // ========== 初始化地图（使用稳定瓦片） ==========
    async function initMap() {
        map = L.map('chinaMap').setView([35.0, 108.0], 5);

        // 使用CartoDB瓦片（国内海外都稳定）
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; CartoDB',
            subdomains: 'abcd',
            maxZoom: 19,
            minZoom: 4
        }).addTo(map);

        L.control.scale({ metric: true, imperial: false, position: 'bottomright' }).addTo(map);
        await loadRegionBoundaries();
        document.getElementById('filterQueryBtn').onclick = applyFilter;
    }

    // ========== 页面启动 ==========
    window.onload = async function() {
        if (!localStorage.getItem('isLogin')) { location.href = 'login.html'; return; }
        try {
            const res = await fetch("/user/info", { credentials: "include" });
            const result = await res.json();
            if (result.code === 200 && result.data && result.data.username) {
                document.getElementById('userInitial').innerText = getNameInitials(result.data.username);
            } else {
                localStorage.removeItem('isLogin');
                location.href = 'login.html';
                return;
            }
        } catch(e) {
            localStorage.removeItem('isLogin');
            location.href = 'login.html';
            return;
        }
        loadStatus();
        await initMap();
        await updateRedDot();
    };
</script>
