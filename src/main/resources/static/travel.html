<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>壹一森林 - 足迹地图</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/pinyin-pro@3.19.6/dist/index.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #fff9f5; font-family: system-ui, "Microsoft YaHei", sans-serif; overflow-x: hidden; }

        /* ========== 顶部导航 手机自适应 ========== */
        .big {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgb(255, 255, 158);
            margin: 12px auto;
            padding: 10px 14px;
            width: calc(100% - 20px);
            max-width: 1000px;
            border-radius: 28px;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }
        .first { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .heart {
            font-size: 20px;
            cursor: pointer;
            background: rgba(255, 220, 180, 0.4);
            width: 34px; height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .heart:active { transform: scale(0.94); background: #ffe0b5; }
        .name p { font-size: 11px; line-height: 1.25; color: rgb(146, 86, 30); font-weight: 500; }
        .name p:first-child { font-size: 10px; letter-spacing: 0.5px; opacity: 0.8; }
        .bell {
            font-size: 20px;
            color: rgb(199, 199, 158);
            cursor: pointer;
            background: rgba(255, 240, 200, 0.5);
            width: 34px; height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            position: relative;
        }
        .bell:active { transform: scale(0.94); color: #f8446e; }
        .red-dot {
            position: absolute;
            top: 2px; right: 4px;
            width: 10px; height: 10px;
            background: #f8446e;
            border-radius: 50%;
            display: none;
            border: 1.5px solid #ffff9e;
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: rgb(252, 252, 192);
            padding: 6px 12px;
            border-radius: 40px;
            flex: 1 1 auto;
            min-width: 160px;
        }
        .nav-item {
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: rgb(146, 86, 30);
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-item.active { background-color: rgb(255, 239, 200); color: #bc6f2c; transform: translateY(-1px); }
        .nav-item:active { background-color: rgb(255, 230, 180); transform: scale(0.96); }
        .user-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffdde0;
            padding: 6px 12px;
            border-radius: 40px;
            color: #c74c70;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .user-right:active { background: #ffcbd1; transform: scale(0.97); }
        .switch-btn { width: 28px; height: 14px; background: #fff; border-radius: 10px; position: relative; }
        .switch-btn::before {
            content: '';
            width: 10px; height: 10px;
            background: #f8446e;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        @media (max-width: 620px) {
            .big { flex-direction: column; align-items: stretch; padding: 12px; gap: 10px; }
            .first { justify-content: space-between; width: 100%; }
            .nav { width: 100%; justify-content: center; }
            .user-right { align-self: flex-end; width: fit-content; }
            .nav-item { padding: 6px 10px; font-size: 13px; }
        }
        @media (max-width: 480px) {
            .nav-item { padding: 5px 8px; font-size: 12px; }
            .first .heart, .first .bell { width: 32px; height: 32px; }
        }

        /* ========== 筛选与统计 ========== */
        .filter-bar {
            max-width: 1000px;
            margin: 20px auto 12px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            background: #fffaf5;
            border-radius: 32px;
            width: calc(100% - 30px);
        }
        .filter-title { font-size: 20px; color: #e67a8a; font-weight: 700; }
        .filter-select {
            padding: 8px 14px;
            border: 1px solid #f0d8c0;
            border-radius: 40px;
            outline: none;
            font-size: 14px;
            background: #fff;
        }
        .filter-btn {
            padding: 8px 20px;
            background: #ffccd5;
            color: #c74c70;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .filter-btn:active { background: #ffb8c4; transform: scale(0.96); }
        .stats-bar {
            max-width: 1000px;
            margin: 0 auto 15px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            background: #fff0e0;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #a55b2a;
            flex-wrap: wrap;
            width: calc(100% - 30px);
        }
        .stat-badge { display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .stat-color { width: 14px; height: 14px; border-radius: 20px; }

        /* ========== 地图容器 ========== */
        .map-wrap {
            max-width: 1000px;
            margin: 0 auto 15px;
            padding: 0 15px;
            position: relative;
        }
        #chinaMap {
            width: 100%;
            height: 520px;
            border-radius: 28px;
            border: 2px solid #ffccd5;
            background: #e8f0f5;
            z-index: 1;
        }
        @media (max-width: 768px) { #chinaMap { height: 440px; } }

        .city-list-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            background: #fffef8;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 6px 18px rgba(255, 204, 213, 0.25);
            border: 1px solid #ffccd5;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        @media (max-width: 550px) { .city-list-panel { display: none; } }
        .city-list-title { text-align: center; color: #c74c70; font-weight: 800; margin-bottom: 10px; font-size: 13px; }
        .city-list-item {
            padding: 6px 10px;
            background: #fff9f5;
            border-radius: 20px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #9c5a22;
            border-left: 3px solid #ffccd5;
            cursor: pointer;
        }
        .city-list-item:active { background: #ffede5; }
        .desc-tips {
            max-width: 1000px;
            margin: 10px auto 30px;
            padding: 12px 18px;
            text-align: center;
            color: #9c5a22;
            font-size: 12px;
            background: #fff2e6;
            border-radius: 40px;
            width: calc(100% - 30px);
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1200;
            padding: 16px;
        }
        .modal-content {
            background: #fffef8;
            width: 90%;
            max-width: 280px;
            padding: 22px;
            border-radius: 32px;
            text-align: center;
        }
        .modal-content h3 { color: #9c5a22; margin-bottom: 15px; }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .modal-btn {
            padding: 6px 18px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            min-width: 80px;
            font-weight: 500;
        }
        .cancel { background: #f1f1f1; color: #6b4c2c; }
        .logout { background: #f8446e; color: #fff; }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7d9c4;
            color: #a3442e;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 1100;
            pointer-events: none;
        }
        .city-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1300;
            padding: 15px;
        }
        .city-card {
            background: #fffaf2;
            border-radius: 32px;
            width: 100%;
            max-width: 360px;
            padding: 24px 20px;
            text-align: center;
            border: 1px solid #ffddb0;
            animation: fadeInUp 0.2s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .city-title { font-size: 24px; font-weight: 800; color: #c74c70; margin-bottom: 16px; border-bottom: 2px dashed #ffccd5; padding-bottom: 10px; }
        .state-group { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .state-btn {
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .state-btn:active { transform: scale(0.95); }
        .func-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .func-btn {
            background: #ffdde0;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            color: #b94e6e;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .func-btn:active { background: #ffccd5; transform: scale(0.97); }
        .close-card-btn {
            margin-top: 18px;
            padding: 10px 24px;
            background: #ffe0d4;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            color: #b3623a;
            font-size: 14px;
            font-weight: 600;
        }
        .close-card-btn:active { background: #ffd0c0; transform: scale(0.96); }
    </style>
</head>
<body>

<div class="big">
    <div class="first">
        <div class="heart" onclick="toUserInfo()">❤️</div>
        <div class="name"><p>SPACE</p><p>壹一森林</p></div>
        <div class="bell" onclick="goToMessage()">
            <i class="fa-solid fa-bell"></i>
            <span class="red-dot" id="redDot"></span>
        </div>
    </div>
    <div class="nav">
        <div class="nav-item" onclick="go('index')"><strong>首页</strong></div>
        <div class="nav-item" onclick="go('role')"><strong>朋友</strong></div>
        <div class="nav-item" onclick="go('record')"><strong>记录</strong></div>
        <div class="nav-item" onclick="go('album')"><strong>相册</strong></div>
        <div class="nav-item active" onclick="go('map')"><strong>地图</strong></div>
    </div>
    <div class="user-right" onclick="showLogoutModal()">
        <span id="userInitial">加载中...</span>
        <div class="switch-btn" id="switch"></div>
    </div>
</div>

<div class="filter-bar">
    <span class="filter-title">🗺️ 足迹地图</span>
    <select class="filter-select" id="stateFilterSelect">
        <option value="all">全部状态</option>
        <option value="go">✅ 已去过</option>
        <option value="want">💗 想去打卡</option>
    </select>
    <button class="filter-btn" id="filterQueryBtn">筛选查询</button>
</div>

<div class="stats-bar">
    <div class="stat-badge"><span class="stat-color" style="background:#7ccd7c;"></span> <span id="goCount">0</span> 已去过</div>
    <div class="stat-badge"><span class="stat-color" style="background:#ff4a6c;"></span> <span id="wantCount">0</span> 想去</div>
</div>

<div class="map-wrap">
    <div id="chinaMap"></div>
    <div class="city-list-panel">
        <div class="city-list-title">📍 我的足迹</div>
        <div id="cityListContent"></div>
    </div>
</div>
<div class="desc-tips">💡 点击地图上的省份区域 → 标记去过/想去 | 上传相册 📸 | 写记录 ✍️ | 发攻略 📖</div>

<div class="modal" id="logoutModal">
    <div class="modal-content"><h3>确定退出登录？</h3>
        <div class="modal-btns"><button class="modal-btn cancel" onclick="closeModal()">取消</button><button class="modal-btn logout" onclick="logout()">退出</button></div>
    </div>
</div>

<script>
    // ==================== 工具函数 ====================
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
    function getNameInitials(username) { /* ... 你的原有函数 ... */ }
    function closeModal() { /* ... */ }
    function showLogoutModal() { /* ... */ }
    async function logout() { /* ... */ }
    async function updateRedDot() { /* ... */ }
    function toastMsg(msg) { /* ... */ }
    function toUserInfo() { location.href = "user-info.html"; }
    function goToMessage() { location.href = "message.html"; }
    function go(page) { const links = { index:"index.html", role:"member.html", record:"diary.html", album:"about.html", map:"travel.html" }; location.href = links[page]; }

    // ==================== 地图状态核心 ====================
    let regionStatus = {}, map, regionLayers = {}, currentFilter = 'all';

    // 🌟 根据状态获取省份的填充样式（区域填色）
    function getRegionStyle(status) {
        switch(status) {
            case 'go':
                return {
                    color: '#2E8B57',      // 边界颜色: 墨绿
                    weight: 1.5,            // 边界粗细
                    fillColor: '#7ccd7c',   // 填充颜色: 清新绿
                    fillOpacity: 0.65       // 填充透明度
                };
            case 'want':
                return {
                    color: '#ff476b',
                    weight: 1.5,
                    fillColor: '#ff6b8c',
                    fillOpacity: 0.55
                };
            default:
                return {
                    color: '#c4b5a6',
                    weight: 1,
                    fillColor: '#e8e0d8',
                    fillOpacity: 0.35
                };
        }
    }

    // 更新单个省份的样式
    function updateRegionStyle(regionName, status) {
        if(!regionLayers[regionName]) return;
        const style = getRegionStyle(status);
        regionLayers[regionName].setStyle(style);
        saveStatus(); // 保存状态到本地存储
    }

    // 更新统计数字和右侧列表
    function updateStats() {
        let go=0, want=0;
        for(let r in regionStatus) {
            if(regionStatus[r]==='go') go++;
            else if(regionStatus[r]==='want') want++;
        }
        document.getElementById('goCount').innerText = go;
        document.getElementById('wantCount').innerText = want;
        renderRegionList();
    }

    function saveStatus() {
        localStorage.setItem('region_status_data', JSON.stringify(regionStatus));
        updateStats();
    }

    function loadStatus() {
        const saved = localStorage.getItem('region_status_data');
        if(saved) regionStatus = JSON.parse(saved);
    }

    function renderRegionList() { /* ... 保持你原有的列表渲染逻辑 ... */ }

    // 跳转到城市详情页
    window.openRegionAction = function(regionName, provinceName, actionType) {
        let targetUrl = `city-detail.html?city=${encodeURIComponent(regionName)}&province=${encodeURIComponent(provinceName)}`;
        if(actionType === 'album') targetUrl += `&tab=album`;
        else if(actionType === 'diary') targetUrl += `&tab=record`;
        else if(actionType === 'strategy') targetUrl += `&tab=strategy`;
        window.location.href = targetUrl;
    };

    // 设置状态
    window.setRegionStatus = function(regionName, statusType, provinceName) {
        if(statusType === 'go') {
            regionStatus[regionName] = 'go';
            updateRegionStyle(regionName, 'go');
            toastMsg(`✅ ${regionName} 标记为已去过`);
        }
        else if(statusType === 'want') {
            regionStatus[regionName] = 'want';
            updateRegionStyle(regionName, 'want');
            toastMsg(`💗 ${regionName} 加入想去清单`);
        }
        else {
            delete regionStatus[regionName];
            updateRegionStyle(regionName, null);
            toastMsg(`🔄 ${regionName} 状态已清空`);
        }
        document.querySelector('.city-modal')?.remove();
    };

    // 省份点击弹窗
    function openRegionPanel(regionName, provinceName) {
        // ... 保持你原有的弹窗HTML和逻辑 ...
        // 注意：弹窗内的按钮调用上面的 window.setRegionStatus 和 window.openRegionAction
    }

    // 筛选功能
    function applyFilter() {
        currentFilter = document.getElementById('stateFilterSelect').value;
        for(let name in regionLayers) {
            const st = regionStatus[name];
            const shouldShow = currentFilter === 'all' || currentFilter === st;
            // 通过设置透明度来隐藏或显示
            regionLayers[name].setStyle({ opacity: shouldShow ? 1 : 0.15 });
        }
        renderRegionList();
        toastMsg('✅ 筛选完成');
    }

    // 🌟 核心函数：加载并使用本地的GeoJSON数据绘制地图区域
    async function loadRegionBoundaries() {
        toastMsg('🌏 加载中国地图数据...');

        // 关键：指向你下载并放置好的本地GeoJSON文件
        const geoJsonUrl = '/geo/中国_省.geojson';

        try {
            const response = await fetch(geoJsonUrl);
            // 检查响应是否成功
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();

            // 清除旧图层
            for(let k in regionLayers) if(regionLayers[k]) map.removeLayer(regionLayers[k]);
            regionLayers = {};

            // 遍历GeoJSON中的所有省份要素
            data.features.forEach(province => {
                // 从属性中获取省份名称（天地图数据中的字段名是 'name'）
                const name = province.properties.name;
                // 获取该省份的存储状态，用于初始化颜色
                const status = regionStatus[name];
                const style = getRegionStyle(status);

                // 将GeoJSON要素添加到地图
                const layer = L.geoJSON(province, {
                    style: style,
                    interactive: true // 允许点击交互
                }).addTo(map);

                // 绑定鼠标悬停提示
                layer.bindTooltip(name, { permanent: false, direction: 'center' });
                // 绑定点击事件，弹出操作面板
                layer.on('click', () => openRegionPanel(name, name));

                // 存储图层，以便后续更新状态
                regionLayers[name] = layer;
            });

            updateStats();
            toastMsg('✅ 地图加载完成，点击省份即可记录足迹');

        } catch(error) {
            console.error('加载地图数据失败:', error);
            toastMsg('地图加载失败，请检查网络或GeoJSON文件路径是否正确');
            // 可选：在控制台输出更详细的错误，便于调试
            console.error('请确认文件是否放置在 src/main/resources/static/geo/中国_省.geojson');
        }
    }

    // 初始化地图和图层
    async function initMap() {
        // 使用高德地图作为底图（注意：高德瓦片在国内访问稳定）
        map = L.map('chinaMap').setView([35.0, 108.0], 5);
        L.tileLayer('https://webrd0.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            minZoom: 4, maxZoom: 10, attribution: '高德地图', subdomains: '1234'
        }).addTo(map);

        // 添加比例尺控件
        L.control.scale({ metric: true, imperial: false, position: 'bottomright' }).addTo(map);

        // 加载我们的GeoJSON数据
        await loadRegionBoundaries();

        // 绑定筛选按钮事件
        document.getElementById('filterQueryBtn').onclick = applyFilter;
    }

    // 页面启动
    window.onload = async function() {
        // 登录检查和用户信息加载逻辑保持不变
        if (!localStorage.getItem('isLogin')) { location.href = 'login.html'; return; }
        try {
            const res = await fetch("/user/info", { credentials: "include" });
            const result = await res.json();
            if (result.code === 200 && result.data && result.data.username) {
                document.getElementById('userInitial').innerText = getNameInitials(result.data.username);
            } else { localStorage.removeItem('isLogin'); location.href = 'login.html'; return; }
        } catch(e) { localStorage.removeItem('isLogin'); location.href = 'login.html'; return; }

        loadStatus();      // 加载本地存储的足迹状态
        await initMap();   // 初始化地图和GeoJSON图层
        await updateRedDot();
    };
</script>
</body>
</html>
