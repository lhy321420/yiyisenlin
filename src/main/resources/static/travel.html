<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>壹一森林 - 地图</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/pinyin-pro@3.19.6/dist/index.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #fff9f5; font-family: "Microsoft YaHei", sans-serif; overflow-x:hidden; }

        /* ========== 顶部导航 手机自适应 ========== */
        .big {
            display: flex;
            align-items: center;
            background: rgb(255, 255, 158);
            padding: 10px 12px;
            justify-content: space-between;
            margin: 10px auto;
            width:95%;
            max-width:1200px;
            border-radius: 15px;
            min-height: 50px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .first { display: flex; align-items: center; gap: 6px; }
        .heart{font-size:16px;cursor:pointer;transition:0.2s;}
        .heart:hover{transform:scale(1.1);}
        .name p { font-size: 12px; line-height: 1.2; color: rgb(146, 86, 30); }
        .bell{font-size:18px;color:rgb(199,199,158);cursor:pointer;margin-left:6px;transition:0.3s;position:relative;}
        .bell:hover{color:#f8446e;}
        .red-dot{position:absolute;top:-5px;right:-8px;width:10px;height:10px;background:#f8446e;border-radius:50%;display:none;}

        .nav {
            display: flex;
            background: rgb(252,252,192);
            color: rgb(146,86,30);
            padding: 4px 8px;
            border-radius: 15px;
            min-height: 32px;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width:100%;
        }
        .nav-item {
            padding: 4px 8px;
            border: 2px solid transparent;
            border-radius: 15px;
            transition: all 0.3s ease;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-item.active {
            background-color: rgb(255,239,200);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .nav-item:hover {
            background-color: rgb(255,239,200);
            transform: translateY(-1px);
        }
        .user-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffdde0;
            padding: 6px 10px;
            border-radius: 20px;
            color: #c74c70;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .switch-btn {
            width: 28px;
            height: 14px;
            background: #fff;
            border-radius: 10px;
            position: relative;
        }
        .switch-btn::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #f8446e;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        .switch-btn.active::before { left: 16px; }

        /* ========== 筛选栏 手机适配 ========== */
        .filter-bar {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            background: #fffaf5;
            border-radius: 20px;
        }
        .filter-title { font-size: 20px; color: #e67a8a; font-weight: 600; }
        .filter-select {
            padding: 6px 12px;
            border: 1px solid #f0d8c0;
            border-radius: 16px;
            outline: none;
            font-size: 13px;
            background: #fff;
        }
        .filter-btn {
            padding: 6px 16px;
            background: #ffccd5;
            color: #c74c70;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            font-size: 13px;
        }
        .filter-btn:hover { background: #ffb3c1; }

        /* ========== 统计栏 手机适配 ========== */
        .stats-bar {
            max-width: 1100px;
            margin: 0 auto 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            background: #fff0e0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #a55b2a;
            flex-wrap: wrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .stat-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }
        .stat-color {
            width: 14px;
            height: 14px;
            border-radius: 20px;
        }

        /* ========== 地图容器 手机全屏 ========== */
        .map-wrap {
            max-width: 1200px;
            margin: 0 auto 15px;
            padding: 0 15px;
            position: relative;
        }
        #chinaMap {
            width: 100%;
            height: 500px;
            border-radius: 16px;
            border: 2px solid #ffccd5;
            background: #fff9f5;
            z-index: 1;
        }
        /* 手机端地图高度缩小 */
        @media (max-width:768px){
            #chinaMap{
                height: 420px;
            }
        }

        /* ========== 右侧城市面板 手机自动隐藏/适配 ========== */
        .city-list-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            background: #fff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 12px rgba(255,204,213,0.2);
            border: 1px solid #ffccd5;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
        }
        /* 小屏手机自动隐藏右侧面板，避免遮挡 */
        @media (max-width:500px){
            .city-list-panel{
                display: none;
            }
        }
        .city-list-title {
            text-align: center;
            color: #c74c70;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .city-list-item {
            padding: 4px 8px;
            background: #fff9f5;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 12px;
            color: #9c5a22;
            border-left: 3px solid #ffccd5;
        }
        .city-list-empty {
            text-align: center;
            color: #ccc;
            font-size: 12px;
            padding: 8px 0;
        }

        /* 提示文字 */
        .desc-tips {
            max-width: 90%;
            margin: 10px auto 30px;
            padding: 10px 15px;
            text-align: center;
            color: #9c5a22;
            font-size: 12px;
            background: #fff2e6;
            border-radius: 20px;
            line-height: 1.4;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 15px;
        }
        .modal-content {
            background: #fff;
            width: 280px;
            max-width: 100%;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .modal-btn {
            padding: 6px 18px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
        }
        .cancel { background: #f1f1f1; }
        .logout { background: #f8446e; color: #fff; }

        /* 轻提示 */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7d9c4;
            color: #a3442e;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            pointer-events: none;
        }

        /* 城市弹窗 手机全屏适配 */
        .city-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }
        .city-card {
            background-color: #fffaf2;
            border-radius: 20px;
            width: 100%;
            max-width: 340px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.25);
            text-align: center;
            border: 1px solid #ffddb0;
            animation: fadeInUp 0.25s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .city-title {
            font-size: 22px;
            font-weight: bold;
            color: #c74c70;
            margin-bottom: 15px;
            border-bottom: 2px dashed #ffccd5;
            padding-bottom: 8px;
        }
        .state-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .state-btn {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .state-btn:hover { transform: scale(0.96); opacity: 0.9; }
        .func-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .func-btn {
            background-color: #ffdde0;
            border: none;
            padding: 10px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            color: #b94e6e;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .func-btn:hover {
            background-color: #ffccd5;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 179, 193, 0.4);
        }
        .close-card-btn {
            margin-top: 15px;
            padding: 8px 24px;
            background: #ffe0d4;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: #b3623a;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .close-card-btn:hover {
            background: #ffd0c0;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 224, 212, 0.4);
        }
        .province-label {
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 0 white;
            color: #c74c70;
            white-space: nowrap;
            background: rgba(255,255,255,0.85);
            padding: 2px 6px;
            border-radius: 15px;
            border: 1px solid #ffb3c1;
        }
        .city-tooltip {
            font-size: 12px;
            font-weight: bold;
            background: rgba(255,255,255,0.9);
            border: 1px solid #ffccd5;
            color: #c74c70;
            padding: 4px 8px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="big">
    <div class="first">
        <div class="heart" onclick="toUserInfo()">❤️</div>
        <div class="name"><p>SPACE</p><p>壹一森林</p></div>
        <div class="bell" onclick="goToMessage()">
            <i class="fa-solid fa-bell"></i>
            <span class="red-dot" id="redDot"></span>
        </div>
    </div>
    <div class="nav">
        <div class="nav-item" onclick="go('index')"><strong>首页</strong></div>
        <div class="nav-item" onclick="go('role')"><strong>朋友</strong></div>
        <div class="nav-item" onclick="go('record')"><strong>记录</strong></div>
        <div class="nav-item" onclick="go('album')"><strong>相册</strong></div>
        <div class="nav-item active" onclick="go('map')"><strong>地图</strong></div>
    </div>
    <div class="user-right" onclick="showLogoutModal()">
        <span id="userInitial">加载中...</span>
        <div class="switch-btn" id="switch"></div>
    </div>
</div>

<div class="filter-bar">
    <h2 class="filter-title">森林地图</h2>
    <select class="filter-select" id="stateFilterSelect">
        <option value="all">全部状态</option>
        <option value="go">已去过</option>
        <option value="want">想去打卡</option>
    </select>
    <button class="filter-btn" id="filterQueryBtn">筛选查询</button>
</div>

<div class="stats-bar">
    <div class="stat-badge"><span class="stat-color" style="background:#7ccd7c;"></span> <span id="goCount">0</span> 已去过</div>
    <div class="stat-badge"><span class="stat-color" style="background:#ff4a6c;"></span> <span id="wantCount">0</span> 想去</div>
</div>

<div class="map-wrap">
    <div id="chinaMap"></div>
    <div class="city-list-panel" id="cityListPanel">
        <div class="city-list-title">📍 筛选城市列表</div>
        <div id="cityListContent"></div>
    </div>
</div>

<div class="desc-tips">
    💡 点击城市区域 → 修改状态(绿色=已去过 / 粉色=想去) | 取消状态 | 上传相册 📸 | 写记录 ✍️ | 发攻略 📖
</div>

<div class="modal" id="logoutModal">
    <div class="modal-content">
        <h3>确定退出登录？</h3>
        <div class="modal-btns">
            <button class="modal-btn cancel" onclick="closeModal()">取消</button>
            <button class="modal-btn logout" onclick="logout()">退出</button>
        </div>
    </div>
</div>

<script>
    // ==================== 顶部导航功能 ====================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    function getNameInitials(username) {
        if (!username) return '游客';
        return username.charAt(0).toUpperCase();
    }

    function closeModal() {
        document.getElementById('logoutModal').style.display = 'none';
        document.getElementById('switch').classList.remove('active');
    }
    function toUserInfo() { location.href = "user-info.html"; }
    function goToMessage() { window.location.href = "message.html"; }
    function go(page) {
        const links = { index:"index.html", role:"member.html", record:"diary.html", album:"about.html", map:"travel.html" };
        window.location.href = links[page];
    }
    function showLogoutModal() {
        document.getElementById('logoutModal').style.display = 'flex';
        document.getElementById('switch').classList.add('active');
    }
    async function logout() {
        localStorage.removeItem('isLogin');
        localStorage.removeItem('username');
        try { await fetch("/user/logout", { method: "POST", credentials: "include" }); } catch(e){}
        location.href = 'login.html';
    }

    async function updateRedDot() {
        try {
            const res = await fetch("/user/unreadRequestCount", { method: "GET", credentials: "include" });
            const result = await res.json();
            const redDot = document.getElementById('redDot');
            if (result.code === 200 && result.data > 0) redDot.style.display = 'block';
            else redDot.style.display = 'none';
        } catch(e) { console.error(e); }
    }

    function toastMsg(msg) {
        let toast = document.querySelector('.toast-msg');
        if(toast) toast.remove();
        let div = document.createElement('div');
        div.className = 'toast-msg';
        div.innerText = msg;
        document.body.appendChild(div);
        setTimeout(() => { if(div) div.remove(); }, 2000);
    }

    // ==================== 核心：城市状态 + 地图染色 ====================
    let cityStatus = {};
    let map, cityLayers = {};
    let currentFilter = 'all';

    // 状态颜色（整个市染色）
    function getStyleByStatus(status) {
        switch(status) {
            case 'go':
                return {
                    color: '#2E8B57',
                    weight: 2,
                    fillColor: '#7ccd7c',
                    fillOpacity: 0.6
                };
            case 'want':
                return {
                    color: '#ff476b',
                    weight: 2,
                    fillColor: '#ff4163',
                    fillOpacity: 0.5
                };
            default:
                return {
                    color: '#999',
                    weight: 1,
                    fillColor: '#fff',
                    fillOpacity: 0.1
                };
        }
    }

    // 更新整个市的颜色
    function updateCityStyle(cityName, status) {
        if (!cityLayers[cityName]) return;
        const style = getStyleByStatus(status);
        cityLayers[cityName].setStyle(style);
        saveStatus();
    }

    // 统计数量
    function updateStats() {
        let go = 0, want = 0;
        for (let city in cityStatus) {
            if (cityStatus[city] === 'go') go++;
            else if (cityStatus[city] === 'want') want++;
        }
        document.getElementById('goCount').innerText = go;
        document.getElementById('wantCount').innerText = want;
        renderCityList();
    }

    // 保存状态
    function saveStatus() {
        localStorage.setItem('city_status_data', JSON.stringify(cityStatus));
        updateStats();
    }

    // 加载状态
    function loadStatus() {
        const saved = localStorage.getItem('city_status_data');
        if (saved) cityStatus = JSON.parse(saved);
    }

    // 城市列表
    function renderCityList() {
        let list = [];
        for(let name in cityStatus) {
            let st = cityStatus[name];
            if(currentFilter === 'all') list.push({name, st});
            else if(currentFilter === 'go' && st === 'go') list.push({name, st});
            else if(currentFilter === 'want' && st === 'want') list.push({name, st});
        }

        let html = list.length === 0
            ? '<div class="city-list-empty">暂无城市</div>'
            : list.map(item => `
                <div class="city-list-item" style="border-left-color:${item.st==='go'?'#7ccd7c':'#ffb3c1'}">
                    ${escapeHtml(item.name)}
                </div>
            `).join('');

        document.getElementById('cityListContent').innerHTML = html;
    }

    // ==================== 点击城市 → 弹出面板 ====================
    function openCityPanel(cityName, provinceName) {
        document.querySelectorAll('.city-modal').forEach(e => e.remove());

        const modal = document.createElement('div');
        modal.className = 'city-modal';
        modal.innerHTML = `
        <div class="city-card">
            <div class="city-title">${cityName}</div>
            <div class="state-group">
                <button class="state-btn" style="background:#7ccd7c;color:#fff" onclick="setStatus('go','${cityName}')">✅ 已去过</button>
                <button class="state-btn" style="background:#ff4a6c;color:#fff" onclick="setStatus('want','${cityName}')">💗 想去</button>
                <button class="state-btn" style="background:#ccc" onclick="setStatus('clear','${cityName}')">🔄 取消状态</button>
            </div>
            <div class="func-group">
                <button class="func-btn" onclick="goPage('album','${provinceName}','${cityName}')">📸 上传相册</button>
                <button class="func-btn" onclick="goPage('record','${provinceName}','${cityName}')">✍️ 写记录</button>
                <button class="func-btn" onclick="goPage('strategy','${provinceName}','${cityName}')">📖 发攻略</button>
            </div>
            <button class="close-card-btn" onclick="this.closest('.city-modal').remove()">关闭</button>
        </div>`;
        document.body.appendChild(modal);
        modal.onclick = e => e.target === modal && modal.remove();
    }

    // 设置状态（自动染色整个市）
    function setStatus(type, cityName) {
        if (type === 'go') {
            cityStatus[cityName] = 'go';
            updateCityStyle(cityName, 'go');
            toastMsg(`✅ ${cityName} 已去过`);
        }
        else if (type === 'want') {
            cityStatus[cityName] = 'want';
            updateCityStyle(cityName, 'want');
            toastMsg(`💗 ${cityName} 想去打卡`);
        }
        else {
            delete cityStatus[cityName];
            updateCityStyle(cityName, null);
            toastMsg(`🔄 ${cityName} 状态已清空`);
        }
        document.querySelector('.city-modal')?.remove();
    }

    // 跳转到功能页
    function goPage(tab, province, city) {
        const url = `city-detail.html?province=${encodeURIComponent(province)}&city=${encodeURIComponent(city)}&tab=${tab}`;
        window.open(url, '_blank');
    }

    // ==================== 地图筛选 ====================
    function applyFilter() {
        currentFilter = document.getElementById('stateFilterSelect').value;
        for (let name in cityLayers) {
            const st = cityStatus[name];
            const style = currentFilter === 'all' || currentFilter === st
                ? getStyleByStatus(st)
                : { color:'#eee', fillColor:'#f9f9f9', fillOpacity:0.1, weight:1 };
            cityLayers[name].setStyle(style);
        }
        renderCityList();
        toastMsg('✅ 筛选完成');
    }

    // ==================== 加载地图 + 城市边界 ====================
    async function loadCityBoundaries() {
        toastMsg('正在加载城市...');
        const res = await fetch('/geo/china.json');
        const data = await res.json();

        // 清空旧图层
        for (let k in cityLayers) map.removeLayer(cityLayers[k]);
        cityLayers = {};

        data.features.forEach(f => {
            const city = f.properties.name;
            const province = f.properties.province || city;
            const status = cityStatus[city];

            const layer = L.geoJSON(f, {
                style: getStyleByStatus(status)
            }).addTo(map);

            // 点击城市 → 弹出
            layer.on('click', () => openCityPanel(city, province));
            cityLayers[city] = layer;
        });

        updateStats();
        toastMsg('✅ 地图加载完成，点击城市使用功能');
    }

    // 加载省级轮廓
    async function loadProvinceBoundary() {
        const res = await fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json');
        const data = await res.json();
        L.geoJSON(data, {
            style: { fillOpacity:0, color:'#ff6b8c', weight:1 },
            interactive: false
        }).addTo(map);
    }

    // 初始化地图
    async function initMap() {
        map = L.map('chinaMap').setView([35.0, 108.0], 5);
        L.tileLayer('https://webrd0.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            minZoom:4, maxZoom:18, attribution:'高德地图'
        }).addTo(map);

        await loadProvinceBoundary();
        await loadCityBoundaries();

        document.getElementById('filterQueryBtn').onclick = applyFilter;
        renderCityList();
    }

    // ==================== 启动 ====================
    async function init() {
        if (!localStorage.getItem('isLogin')) return location.href = 'login.html';
        try {
            const res = await fetch("/user/info", { credentials:'include' });
            const d = (await res.json()).data;
            document.getElementById('userInitial').innerText = getNameInitials(d.username);
        } catch(e) {}

        loadStatus();
        await initMap();
        updateRedDot();
    }

    window.addEventListener('load', init);
</script>
</body>
</html>
