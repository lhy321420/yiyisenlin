<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>壹一森林 - 足迹地图</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/pinyin-pro@3.19.6/dist/index.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #fff9f5; font-family: system-ui, "Microsoft YaHei", sans-serif; overflow-x: hidden; }

        /* ========== 顶部导航 手机自适应 ========== */
        .big {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgb(255, 255, 158);
            margin: 12px auto;
            padding: 10px 14px;
            width: calc(100% - 20px);
            max-width: 1000px;
            border-radius: 28px;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }
        .first { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .heart {
            font-size: 20px;
            cursor: pointer;
            background: rgba(255, 220, 180, 0.4);
            width: 34px; height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .heart:active { transform: scale(0.94); background: #ffe0b5; }
        .name p { font-size: 11px; line-height: 1.25; color: rgb(146, 86, 30); font-weight: 500; }
        .name p:first-child { font-size: 10px; letter-spacing: 0.5px; opacity: 0.8; }
        .bell {
            font-size: 20px;
            color: rgb(199, 199, 158);
            cursor: pointer;
            background: rgba(255, 240, 200, 0.5);
            width: 34px; height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            position: relative;
        }
        .bell:active { transform: scale(0.94); color: #f8446e; }
        .red-dot {
            position: absolute;
            top: 2px; right: 4px;
            width: 10px; height: 10px;
            background: #f8446e;
            border-radius: 50%;
            display: none;
            border: 1.5px solid #ffff9e;
        }
        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: rgb(252, 252, 192);
            padding: 6px 12px;
            border-radius: 40px;
            flex: 1 1 auto;
            min-width: 160px;
        }
        .nav-item {
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: rgb(146, 86, 30);
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-item.active { background-color: rgb(255, 239, 200); color: #bc6f2c; transform: translateY(-1px); }
        .nav-item:active { background-color: rgb(255, 230, 180); transform: scale(0.96); }
        .user-right {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffdde0;
            padding: 6px 12px;
            border-radius: 40px;
            color: #c74c70;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .user-right:active { background: #ffcbd1; transform: scale(0.97); }
        .switch-btn { width: 28px; height: 14px; background: #fff; border-radius: 10px; position: relative; }
        .switch-btn::before {
            content: '';
            width: 10px; height: 10px;
            background: #f8446e;
            border-radius: 50%;
            position: absolute;
            top: 2px; left: 2px;
            transition: 0.2s;
        }
        @media (max-width: 620px) {
            .big { flex-direction: column; align-items: stretch; padding: 12px; gap: 10px; }
            .first { justify-content: space-between; width: 100%; }
            .nav { width: 100%; justify-content: center; }
            .user-right { align-self: flex-end; width: fit-content; }
            .nav-item { padding: 6px 10px; font-size: 13px; }
        }
        @media (max-width: 480px) {
            .nav-item { padding: 5px 8px; font-size: 12px; }
            .first .heart, .first .bell { width: 32px; height: 32px; }
        }

        /* ========== 筛选与统计 ========== */
        .filter-bar {
            max-width: 1000px;
            margin: 20px auto 12px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
            background: #fffaf5;
            border-radius: 32px;
            width: calc(100% - 30px);
        }
        .filter-title { font-size: 20px; color: #e67a8a; font-weight: 700; }
        .filter-select {
            padding: 8px 14px;
            border: 1px solid #f0d8c0;
            border-radius: 40px;
            outline: none;
            font-size: 14px;
            background: #fff;
        }
        .filter-btn {
            padding: 8px 20px;
            background: #ffccd5;
            color: #c74c70;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .filter-btn:active { background: #ffb8c4; transform: scale(0.96); }
        .stats-bar {
            max-width: 1000px;
            margin: 0 auto 15px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            background: #fff0e0;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #a55b2a;
            flex-wrap: wrap;
            width: calc(100% - 30px);
        }
        .stat-badge { display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .stat-color { width: 14px; height: 14px; border-radius: 20px; }

        /* ========== 地图容器 ========== */
        .map-wrap {
            max-width: 1000px;
            margin: 0 auto 15px;
            padding: 0 15px;
            position: relative;
        }
        #chinaMap {
            width: 100%;
            height: 520px;
            border-radius: 28px;
            border: 2px solid #ffccd5;
            background: #fff9f5;
            z-index: 1;
        }
        @media (max-width: 768px) { #chinaMap { height: 440px; } }

        .city-list-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 160px;
            background: #fffef8;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 6px 18px rgba(255, 204, 213, 0.25);
            border: 1px solid #ffccd5;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        @media (max-width: 550px) { .city-list-panel { display: none; } }
        .city-list-title { text-align: center; color: #c74c70; font-weight: 800; margin-bottom: 10px; font-size: 13px; }
        .city-list-item {
            padding: 6px 10px;
            background: #fff9f5;
            border-radius: 20px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #9c5a22;
            border-left: 3px solid #ffccd5;
            cursor: pointer;
        }
        .city-list-item:active { background: #ffede5; }
        .desc-tips {
            max-width: 1000px;
            margin: 10px auto 30px;
            padding: 12px 18px;
            text-align: center;
            color: #9c5a22;
            font-size: 12px;
            background: #fff2e6;
            border-radius: 40px;
            width: calc(100% - 30px);
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1200;
            padding: 16px;
        }
        .modal-content {
            background: #fffef8;
            width: 90%;
            max-width: 280px;
            padding: 22px;
            border-radius: 32px;
            text-align: center;
        }
        .modal-content h3 { color: #9c5a22; margin-bottom: 15px; }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .modal-btn {
            padding: 6px 18px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            min-width: 80px;
            font-weight: 500;
        }
        .cancel { background: #f1f1f1; color: #6b4c2c; }
        .logout { background: #f8446e; color: #fff; }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7d9c4;
            color: #a3442e;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 1100;
            pointer-events: none;
        }
        .city-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1300;
            padding: 15px;
        }
        .city-card {
            background: #fffaf2;
            border-radius: 32px;
            width: 100%;
            max-width: 360px;
            padding: 24px 20px;
            text-align: center;
            border: 1px solid #ffddb0;
            animation: fadeInUp 0.2s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .city-title { font-size: 24px; font-weight: 800; color: #c74c70; margin-bottom: 16px; border-bottom: 2px dashed #ffccd5; padding-bottom: 10px; }
        .state-group { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .state-btn {
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .state-btn:active { transform: scale(0.95); }
        .func-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .func-btn {
            background: #ffdde0;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            color: #b94e6e;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .func-btn:active { background: #ffccd5; transform: scale(0.97); }
        .close-card-btn {
            margin-top: 18px;
            padding: 10px 24px;
            background: #ffe0d4;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            color: #b3623a;
            font-size: 14px;
            font-weight: 600;
        }
        .close-card-btn:active { background: #ffd0c0; transform: scale(0.96); }
    </style>
</head>
<body>

<div class="big">
    <div class="first">
        <div class="heart" onclick="toUserInfo()">❤️</div>
        <div class="name"><p>SPACE</p><p>壹一森林</p></div>
        <div class="bell" onclick="goToMessage()">
            <i class="fa-solid fa-bell"></i>
            <span class="red-dot" id="redDot"></span>
        </div>
    </div>
    <div class="nav">
        <div class="nav-item" onclick="go('index')"><strong>首页</strong></div>
        <div class="nav-item" onclick="go('role')"><strong>朋友</strong></div>
        <div class="nav-item" onclick="go('record')"><strong>记录</strong></div>
        <div class="nav-item" onclick="go('album')"><strong>相册</strong></div>
        <div class="nav-item active" onclick="go('map')"><strong>地图</strong></div>
    </div>
    <div class="user-right" onclick="showLogoutModal()">
        <span id="userInitial">加载中...</span>
        <div class="switch-btn" id="switch"></div>
    </div>
</div>

<div class="filter-bar">
    <span class="filter-title">🗺️ 足迹地图</span>
    <select class="filter-select" id="stateFilterSelect">
        <option value="all">全部状态</option>
        <option value="go">✅ 已去过</option>
        <option value="want">💗 想去打卡</option>
    </select>
    <button class="filter-btn" id="filterQueryBtn">筛选查询</button>
</div>

<div class="stats-bar">
    <div class="stat-badge"><span class="stat-color" style="background:#7ccd7c;"></span> <span id="goCount">0</span> 已去过</div>
    <div class="stat-badge"><span class="stat-color" style="background:#ff4a6c;"></span> <span id="wantCount">0</span> 想去</div>
</div>

<div class="map-wrap">
    <div id="chinaMap"></div>
    <div class="city-list-panel">
        <div class="city-list-title">📍 我的足迹</div>
        <div id="cityListContent"></div>
    </div>
</div>
<div class="desc-tips">💡 点击地图上的圆点 → 标记去过/想去 | 上传相册 📸 | 写记录 ✍️ | 发攻略 📖</div>

<div class="modal" id="logoutModal">
    <div class="modal-content"><h3>确定退出登录？</h3>
        <div class="modal-btns"><button class="modal-btn cancel" onclick="closeModal()">取消</button><button class="modal-btn logout" onclick="logout()">退出</button></div>
    </div>
</div>

<script>
    // ==================== 工具函数 ====================
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
    function getNameInitials(username) {
        if (!username) return '游客';
        const { pinyin } = window.pinyinPro || window.pinyin;
        if (!pinyin) return username.charAt(0).toUpperCase();
        return username.split('').map(ch => {
            if (/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
            if (/[\u4e00-\u9fa5]/.test(ch)) { const py = pinyin(ch, { pattern: 'first', toneType: 'none' }); return py ? py.toUpperCase() : ch; }
            return ch.toUpperCase();
        }).join('');
    }
    function closeModal() { document.getElementById('logoutModal').style.display = 'none'; document.getElementById('switch')?.classList.remove('active'); }
    function showLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; document.getElementById('switch')?.classList.add('active'); }
    async function logout() { localStorage.clear(); await fetch("/user/logout", { method: "POST", credentials: "include" }).catch(e=>{}); location.href = 'login.html'; }
    async function updateRedDot() { try { const res = await fetch("/user/unreadRequestCount", { credentials: "include" }); const result = await res.json(); const rd = document.getElementById('redDot'); if(rd) rd.style.display = (result.code === 200 && result.data > 0) ? 'block' : 'none'; } catch(e){} }
    function toastMsg(msg) { let t = document.querySelector('.toast-msg'); if(t) t.remove(); let d = document.createElement('div'); d.className = 'toast-msg'; d.innerText = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2000); }
    function toUserInfo() { location.href = "user-info.html"; }
    function goToMessage() { location.href = "message.html"; }
    function go(page) { const links = { index:"index.html", role:"member.html", record:"diary.html", album:"about.html", map:"travel.html" }; location.href = links[page]; }

    // ==================== 全国省级行政区数据（覆盖34个地区） ====================
    const regionsData = [
        // 直辖市
        { name: "北京市", province: "北京", lng: 116.4074, lat: 39.9042 },
        { name: "天津市", province: "天津", lng: 117.1902, lat: 39.1256 },
        { name: "上海市", province: "上海", lng: 121.4737, lat: 31.2304 },
        { name: "重庆市", province: "重庆", lng: 106.5044, lat: 29.5582 },
        // 省
        { name: "河北省", province: "河北", lng: 114.4995, lat: 38.1006 },
        { name: "山西省", province: "山西", lng: 112.5624, lat: 37.8703 },
        { name: "辽宁省", province: "辽宁", lng: 123.4315, lat: 41.8057 },
        { name: "吉林省", province: "吉林", lng: 125.3245, lat: 43.8868 },
        { name: "黑龙江省", province: "黑龙江", lng: 126.6424, lat: 45.7567 },
        { name: "江苏省", province: "江苏", lng: 118.7674, lat: 32.0415 },
        { name: "浙江省", province: "浙江", lng: 120.1551, lat: 30.2741 },
        { name: "安徽省", province: "安徽", lng: 117.2272, lat: 31.8206 },
        { name: "福建省", province: "福建", lng: 119.2965, lat: 26.0745 },
        { name: "江西省", province: "江西", lng: 115.858, lat: 28.682 },
        { name: "山东省", province: "山东", lng: 117.1205, lat: 36.651 },
        { name: "河南省", province: "河南", lng: 113.6254, lat: 34.7466 },
        { name: "湖北省", province: "湖北", lng: 114.3055, lat: 30.5931 },
        { name: "湖南省", province: "湖南", lng: 112.9388, lat: 28.2282 },
        { name: "广东省", province: "广东", lng: 113.2644, lat: 23.1291 },
        { name: "海南省", province: "海南", lng: 110.1999, lat: 20.044 },
        { name: "四川省", province: "四川", lng: 104.0668, lat: 30.5728 },
        { name: "贵州省", province: "贵州", lng: 106.6302, lat: 26.6477 },
        { name: "云南省", province: "云南", lng: 102.832, lat: 24.8801 },
        { name: "陕西省", province: "陕西", lng: 108.9402, lat: 34.3416 },
        { name: "甘肃省", province: "甘肃", lng: 103.8343, lat: 36.0611 },
        { name: "青海省", province: "青海", lng: 101.7801, lat: 36.6232 },
        { name: "台湾省", province: "台湾", lng: 121.5200, lat: 25.0307 },
        // 自治区
        { name: "内蒙古自治区", province: "内蒙古", lng: 111.751, lat: 40.8415 },
        { name: "广西壮族自治区", province: "广西", lng: 108.320, lat: 22.824 },
        { name: "西藏自治区", province: "西藏", lng: 91.1409, lat: 29.6564 },
        { name: "宁夏回族自治区", province: "宁夏", lng: 106.2309, lat: 38.4872 },
        { name: "新疆维吾尔自治区", province: "新疆", lng: 87.6168, lat: 43.8256 },
        // 特别行政区
        { name: "香港特别行政区", province: "香港", lng: 114.1697, lat: 22.3193 },
        { name: "澳门特别行政区", province: "澳门", lng: 113.5431, lat: 22.1868 }
    ];

    // ==================== 地图状态核心 ====================
    let regionStatus = {}, map, regionMarkers = {}, currentFilter = 'all';

    // 获取标记样式（已去过：绿色大圆；想去：粉色中圆；无状态：橙色小圆）
    function getMarkerStyle(status) {
        if(status === 'go') return { color: '#2E8B57', fillColor: '#7ccd7c', fillOpacity: 0.85, radius: 22 };
        if(status === 'want') return { color: '#ff476b', fillColor: '#ff6b8c', fillOpacity: 0.85, radius: 18 };
        return { color: '#ffaa66', fillColor: '#ffdd99', fillOpacity: 0.7, radius: 14 };
    }

    function updateRegionMarker(regionName, status) {
        if(!regionMarkers[regionName]) return;
        const style = getMarkerStyle(status);
        regionMarkers[regionName].setStyle({
            color: style.color,
            fillColor: style.fillColor,
            fillOpacity: style.fillOpacity,
            radius: style.radius
        });
        saveStatus();
    }

    function updateStats() {
        let go=0, want=0;
        for(let r in regionStatus) {
            if(regionStatus[r]==='go') go++;
            else if(regionStatus[r]==='want') want++;
        }
        document.getElementById('goCount').innerText = go;
        document.getElementById('wantCount').innerText = want;
        renderRegionList();
    }

    function saveStatus() {
        localStorage.setItem('region_status_data', JSON.stringify(regionStatus));
        updateStats();
    }

    function loadStatus() {
        const saved = localStorage.getItem('region_status_data');
        if(saved) regionStatus = JSON.parse(saved);
    }

    function renderRegionList() {
        let list = [];
        for(let name in regionStatus) {
            let st = regionStatus[name];
            if(currentFilter === 'all') list.push({name, st});
            else if(currentFilter === 'go' && st === 'go') list.push({name, st});
            else if(currentFilter === 'want' && st === 'want') list.push({name, st});
        }
        let html = list.length === 0 ? '<div style="text-align:center;color:#b7855b;padding:10px;">暂无足迹</div>' :
            list.map(item => `<div class="city-list-item" style="border-left-color:${item.st === 'go' ? '#7ccd7c' : '#ffb3c1'}" onclick="openRegionPanelFromList('${escapeHtml(item.name)}')">${escapeHtml(item.name)}</div>`).join('');
        document.getElementById('cityListContent').innerHTML = html;
    }

    window.openRegionPanelFromList = function(regionName) {
        const regionData = regionsData.find(r => r.name === regionName);
        if(regionData) openRegionPanel(regionData.name, regionData.province);
        else openRegionPanel(regionName, regionName);
    };

    // 跳转到功能页
    window.openRegionAction = function(regionName, provinceName, actionType) {
        let targetUrl = `city-detail.html?city=${encodeURIComponent(regionName)}&province=${encodeURIComponent(provinceName)}`;
        if(actionType === 'album') targetUrl += `&tab=album`;
        else if(actionType === 'diary') targetUrl += `&tab=record`;
        else if(actionType === 'strategy') targetUrl += `&tab=strategy`;
        window.location.href = targetUrl;
    };

    // 设置状态
    window.setRegionStatus = function(regionName, statusType, provinceName) {
        if(statusType === 'go') {
            regionStatus[regionName] = 'go';
            updateRegionMarker(regionName, 'go');
            toastMsg(`✅ ${regionName} 标记为已去过`);
        }
        else if(statusType === 'want') {
            regionStatus[regionName] = 'want';
            updateRegionMarker(regionName, 'want');
            toastMsg(`💗 ${regionName} 加入想去清单`);
        }
        else {
            delete regionStatus[regionName];
            updateRegionMarker(regionName, null);
            toastMsg(`🔄 ${regionName} 状态已清空`);
        }
        document.querySelector('.city-modal')?.remove();
    };

    // 区域弹窗
    function openRegionPanel(regionName, provinceName) {
        document.querySelectorAll('.city-modal').forEach(e => e.remove());
        const modal = document.createElement('div'); modal.className = 'city-modal';
        modal.innerHTML = `
            <div class="city-card">
                <div class="city-title">🏞️ ${escapeHtml(regionName)}</div>
                <div class="state-group">
                    <button class="state-btn" style="background:#7ccd7c;color:#fff" onclick="window.setRegionStatus('${regionName}','go','${provinceName}')">✅ 已去过</button>
                    <button class="state-btn" style="background:#ff4a6c;color:#fff" onclick="window.setRegionStatus('${regionName}','want','${provinceName}')">💗 想去</button>
                    <button class="state-btn" style="background:#ffe2d1;color:#ffffff" onclick="window.setRegionStatus('${regionName}','clear','${provinceName}')">🔄 取消</button>
                </div>
                <div class="func-group">
                    <button class="func-btn" onclick="window.openRegionAction('${regionName}','${provinceName}','album')">📸 上传相册</button>
                    <button class="func-btn" onclick="window.openRegionAction('${regionName}','${provinceName}','diary')">✍️ 写记录</button>
                    <button class="func-btn" onclick="window.openRegionAction('${regionName}','${provinceName}','strategy')">📖 发攻略</button>
                </div>
                <button class="close-card-btn" onclick="this.closest('.city-modal').remove()">关闭</button>
            </div>`;
        document.body.appendChild(modal);
        modal.onclick = e => e.target === modal && modal.remove();
    }

    // 筛选
    function applyFilter() {
        currentFilter = document.getElementById('stateFilterSelect').value;
        for(let name in regionMarkers) {
            const st = regionStatus[name];
            const shouldShow = currentFilter === 'all' || currentFilter === st;
            if(shouldShow) {
                regionMarkers[name].setStyle({ opacity: 1, fillOpacity: 0.85 });
            } else {
                regionMarkers[name].setStyle({ opacity: 0.2, fillOpacity: 0.05 });
            }
        }
        renderRegionList();
        toastMsg('✅ 筛选完成');
    }

    // 加载区域标记
    async function loadRegionMarkers() {
        toastMsg('🌏 加载中国足迹地图...');
        for(let k in regionMarkers) if(regionMarkers[k]) map.removeLayer(regionMarkers[k]);
        regionMarkers = {};

        regionsData.forEach(region => {
            const status = regionStatus[region.name];
            const style = getMarkerStyle(status);
            const marker = L.circleMarker([region.lat, region.lng], {
                radius: style.radius,
                color: style.color,
                weight: 2.5,
                fillColor: style.fillColor,
                fillOpacity: style.fillOpacity,
                opacity: 1
            }).addTo(map);
            marker.bindTooltip(region.name, { permanent: false, direction: 'top', offset: [0, -12] });
            marker.on('click', () => openRegionPanel(region.name, region.province));
            regionMarkers[region.name] = marker;
        });
        updateStats();
        toastMsg('✅ 地图已加载，点击任意省份即可记录足迹');
    }

    // 初始化地图
    async function initMap() {
        map = L.map('chinaMap').setView([35.0, 108.0], 5);
        L.tileLayer('https://webrd0.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            minZoom: 4, maxZoom: 10, attribution: '高德地图', subdomains: '1234'
        }).addTo(map);
        L.control.scale({ metric: true, imperial: false, position: 'bottomright' }).addTo(map);
        await loadRegionMarkers();
        document.getElementById('filterQueryBtn').onclick = applyFilter;
    }

    // 页面启动
    window.onload = async function() {
        if (!localStorage.getItem('isLogin')) { location.href = 'login.html'; return; }
        try {
            const res = await fetch("/user/info", { credentials: "include" });
            const result = await res.json();
            if (result.code === 200 && result.data && result.data.username) {
                document.getElementById('userInitial').innerText = getNameInitials(result.data.username);
            } else { localStorage.removeItem('isLogin'); location.href = 'login.html'; return; }
        } catch(e) { localStorage.removeItem('isLogin'); location.href = 'login.html'; return; }
        loadStatus();
        await initMap();
        await updateRedDot();
    };
</script>
</body>
</html>
